name: ACHERLAB RDP PREMIUM

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Thoi gian su dung"
        required: false
        default: "5h40m"
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h40m"

jobs:
  Premium-RDP-Setup:
    runs-on: windows-latest
    timeout-minutes: 340

    steps:

      # ============================================================
      # START
      # ============================================================
      - name: START ACHERLAB
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "          ACHERLAB RDP PREMIUM"
          Write-Host "=============================================="
          Write-Host "Time: ${{ github.event.inputs.duration }}"
          Write-Host ""

      # ============================================================
      # CALCULATE TIME
      # ============================================================
      - name: CALCULATE SESSION TIME
        shell: powershell
        run: |
          $duration = "${{ github.event.inputs.duration }}"

          switch ($duration) {
              "1h" {
                  $minutes = 60
                  $display = "1 hour"
              }

              "3h" {
                  $minutes = 180
                  $display = "3 hours"
              }

              "5h40m" {
                  $minutes = 340
                  $display = "5 hours 40 minutes"
              }

              default {
                  $minutes = 340
                  $display = "5 hours 40 minutes"
              }
          }

          "TOTAL_MINUTES=$minutes" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "DISPLAY_TIME=$display" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host "Session: $display"

      # ============================================================
      # ENABLE RDP
      # ============================================================
      - name: ENABLE RDP
        shell: powershell
        run: |

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          netsh advfirewall firewall set rule `
            group="remote desktop" `
            new enable=Yes

          Write-Host "RDP configuration completed."

      # ============================================================
      # CREATE ADMIN USER
      # ============================================================
      - name: CONFIGURE ADMIN USER
        shell: powershell
        env:
          RDP_PASSWORD: "Hn0961718254@"
        run: |

          $username = "admin"
          $password = $env:RDP_PASSWORD

          Write-Host "Configuring user: admin"

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($user) {

              Write-Host "User already exists."

              Set-LocalUser `
                -Name $username `
                -Password $securePassword

              Enable-LocalUser `
                -Name $username `
                -ErrorAction SilentlyContinue

          }
          else {

              Write-Host "Creating user..."

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -Description "Acherlab RDP Administrator"
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "User configuration completed."

      # ============================================================
      # CHECK RDP
      # ============================================================
      - name: CHECK RDP
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "Checking RDP..."

          $user = Get-LocalUser `
            -Name "admin" `
            -ErrorAction SilentlyContinue

          if (-not $user) {
              Write-Host "ERROR: admin user not found."
              exit 1
          }

          Write-Host "OK: admin user exists."

          $service = Get-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          if ($service.Status -ne "Running") {

              Write-Host "Starting TermService..."

              Start-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue
          }

          Start-Sleep -Seconds 3

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($listener) {
              Write-Host "OK: TCP 3389 is listening."
          }
          else {
              Write-Host "WARNING: TCP 3389 is not listening."
          }

      # ============================================================
      # PROXYLINK
      # ============================================================
      - name: CONNECT PROXYLINK
        shell: powershell
        env:
          PROXYLINK_DEPLOY_URL: ${{ secrets.PROXYLINK_DEPLOY_URL }}
        run: |

          Write-Host ""
          Write-Host "Connecting to ProxyLink..."

          if ([string]::IsNullOrWhiteSpace($env:PROXYLINK_DEPLOY_URL)) {

              Write-Host "ERROR: PROXYLINK_DEPLOY_URL is not configured."
              Write-Host ""
              Write-Host "Create this GitHub Actions secret:"
              Write-Host "PROXYLINK_DEPLOY_URL"
              Write-Host ""

              exit 1
          }

          [Net.ServicePointManager]::SecurityProtocol = `
            [Net.SecurityProtocolType]::Tls12

          try {

              Write-Host "Downloading ProxyLink deployment script..."

              $scriptContent = Invoke-RestMethod `
                -Uri $env:PROXYLINK_DEPLOY_URL `
                -Method Get

              if ([string]::IsNullOrWhiteSpace($scriptContent)) {
                  throw "ProxyLink returned an empty response."
              }

              Write-Host "ProxyLink deployment script received."

              Invoke-Expression $scriptContent

              Write-Host "ProxyLink deployment command completed."

          }
          catch {

              Write-Host "ERROR: ProxyLink connection failed."
              Write-Host $_.Exception.Message

              exit 1
          }

          Write-Host ""
          Write-Host "Waiting for ProxyLink registration..."

          Start-Sleep -Seconds 20

      # ============================================================
      # CONNECTION INFO
      # ============================================================
      - name: SHOW CONNECTION INFO
        shell: powershell
        env:
          RDP_USER: "admin"
          RDP_PASSWORD: "Hn0961718254@"
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "           RDP SERVER READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Provider : Acherlab"
          Write-Host "Tunnel   : ProxyLink"
          Write-Host "User     : $env:RDP_USER"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host "Port     : 3389"
          Write-Host ""
          Write-Host "Open the ProxyLink dashboard to get"
          Write-Host "the assigned remote connection address."
          Write-Host ""

          $tz = [System.TimeZoneInfo]::FindSystemTimeZoneById(
              "SE Asia Standard Time"
          )

          $start = [System.TimeZoneInfo]::ConvertTimeFromUtc(
              (Get-Date).ToUniversalTime(),
              $tz
          )

          $end = $start.AddMinutes(
              [int]$env:TOTAL_MINUTES
          )

          Write-Host "Start : $($start.ToString("HH:mm:ss"))"
          Write-Host "End   : $($end.ToString("HH:mm:ss"))"
          Write-Host "Time  : $env:DISPLAY_TIME"
          Write-Host ""

      # ============================================================
      # KEEP SESSION ALIVE
      # ============================================================
      - name: KEEP SESSION ALIVE
        shell: powershell
        run: |

          $totalMinutes = [int]$env:TOTAL_MINUTES

          $startTime = Get-Date
          $endTime = $startTime.AddMinutes($totalMinutes)

          Write-Host ""
          Write-Host "Acherlab RDP session is running."
          Write-Host "Session time: $env:DISPLAY_TIME"
          Write-Host ""

          while ((Get-Date) -lt $endTime) {

              $now = Get-Date
              $remaining = $endTime - $now

              $hours = [math]::Max(
                  0,
                  [math]::Floor($remaining.TotalHours)
              )

              $minutes = [math]::Max(
                  0,
                  [math]::Floor($remaining.TotalMinutes % 60)
              )

              $seconds = [math]::Max(
                  0,
                  [math]::Floor($remaining.TotalSeconds % 60)
              )

              $service = Get-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue

              if ($service.Status -ne "Running") {

                  Write-Host ""
                  Write-Host "TermService stopped. Restarting..."

                  Start-Service `
                    -Name "TermService" `
                    -ErrorAction SilentlyContinue
              }

              $listener = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($listener) {
                  $rdpStatus = "LISTENING"
              }
              else {
                  $rdpStatus = "NOT_LISTENING"
              }

              Write-Host `
                "`r[$(Get-Date -Format HH:mm:ss)] RDP=$rdpStatus | Remaining=$hours`h $minutes`m $seconds`s" `
                -NoNewline

              Start-Sleep -Seconds 10
          }

          Write-Host ""
          Write-Host ""
          Write-Host "Session time expired."

      # ============================================================
      # CLEANUP
      # ============================================================
      - name: CLEANUP
        if: always()
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "Cleaning up..."

          Stop-Service `
            -Name "TermService" `
            -Force `
            -ErrorAction SilentlyContinue

          Disable-LocalUser `
            -Name "admin" `
            -ErrorAction SilentlyContinue

          Write-Host "Cleanup completed."
