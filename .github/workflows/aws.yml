name: 🚀 ACHERLAB RDP PREMIUM

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "🕐 Thời gian sử dụng"
        required: false
        default: "5h40m"
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h40m"

jobs:
  Premium-RDP-Setup:
    runs-on: windows-latest
    timeout-minutes: 340

    steps:

      # ============================================================
      # BANNER
      # ============================================================
      - name: 🎯 KHỞI ĐỘNG ACHERLAB
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║          🚀 ACHERLAB RDP PREMIUM            ║" -ForegroundColor Cyan
          Write-Host "║              Powered by Acherlab             ║" -ForegroundColor Green
          Write-Host "╚══════════════════════════════════════════════╝" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "🕐 Thời gian: ${{ github.event.inputs.duration }}" -ForegroundColor Magenta

      # ============================================================
      # TÍNH THỜI GIAN
      # ============================================================
      - name: ⏱️ TÍNH THỜI GIAN PHIÊN
        shell: powershell
        run: |
          switch ("${{ github.event.inputs.duration }}") {
              "1h" {
                  $minutes = 60
                  $display = "1 giờ"
              }
              "3h" {
                  $minutes = 180
                  $display = "3 giờ"
              }
              "5h40m" {
                  $minutes = 340
                  $display = "5 giờ 40 phút"
              }
              default {
                  $minutes = 340
                  $display = "5 giờ 40 phút"
              }
          }

          echo "TOTAL_MINUTES=$minutes" >> $env:GITHUB_ENV
          echo "DISPLAY_TIME=$display" >> $env:GITHUB_ENV

          Write-Host "✅ Thời lượng: $display" -ForegroundColor Green

      # ============================================================
      # CẤU HÌNH RDP
      # ============================================================
      - name: 🔧 CẤU HÌNH RDP
        shell: powershell
        run: |
          Write-Host "🔧 Đang bật Remote Desktop..." -ForegroundColor Yellow

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          # Cho phép RDP qua Windows Firewall
          netsh advfirewall firewall set rule `
            group="remote desktop" `
            new enable=Yes

          # Kiểm tra port
          Start-Sleep -Seconds 3

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($listener) {
              Write-Host "✅ RDP đang LISTEN trên TCP 3389" -ForegroundColor Green
          }
          else {
              Write-Host "⚠️ Chưa thấy listener TCP 3389" -ForegroundColor Yellow
          }

      # ============================================================
      # TẠO / CẤU HÌNH USER ADMIN
      # ============================================================
      - name: 👤 CẤU HÌNH TÀI KHOẢN ADMIN
        shell: powershell
        env:
          RDP_PASSWORD: "Hn0961718254@"
        run: |
          $username = "admin"
          $password = $env:RDP_PASSWORD

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($user) {

              Write-Host "ℹ️ User admin đã tồn tại" -ForegroundColor Cyan

              Set-LocalUser `
                -Name $username `
                -Password $securePassword

              Enable-LocalUser `
                -Name $username

          }
          else {

              Write-Host "👤 Đang tạo user admin..." -ForegroundColor Yellow

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -Description "Acherlab RDP Administrator"

          }

          # Đảm bảo quyền Administrator
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          # Cho phép Remote Desktop
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "✅ Username: admin" -ForegroundColor Green
          Write-Host "✅ Password đã được cấu hình" -ForegroundColor Green

      # ============================================================
      # KIỂM TRA RDP
      # ============================================================
      - name: 🔍 KIỂM TRA HỆ THỐNG RDP
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "🔍 KIỂM TRA RDP..." -ForegroundColor Yellow

          $user = Get-LocalUser `
            -Name "admin" `
            -ErrorAction SilentlyContinue

          if ($user) {
              Write-Host "✅ User admin tồn tại" -ForegroundColor Green
          }
          else {
              Write-Host "❌ User admin không tồn tại" -ForegroundColor Red
              exit 1
          }

          $admin = Get-LocalGroupMember `
            -Group "Administrators" `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "\\admin$"
            }

          if ($admin) {
              Write-Host "✅ admin có quyền Administrator" -ForegroundColor Green
          }
          else {
              Write-Host "⚠️ Không xác nhận được quyền Administrator" -ForegroundColor Yellow
          }

          $service = Get-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          if ($service.Status -eq "Running") {
              Write-Host "✅ TermService đang chạy" -ForegroundColor Green
          }
          else {
              Write-Host "❌ TermService chưa chạy" -ForegroundColor Red
              Start-Service TermService -ErrorAction SilentlyContinue
          }

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($listener) {
              Write-Host "✅ TCP 3389 đang LISTEN" -ForegroundColor Green
          }
          else {
              Write-Host "❌ TCP 3389 không LISTEN" -ForegroundColor Red
          }

      # ============================================================
      # PROXYLINK
      #
      # Tạo GitHub Secret:
      #
      # PROXYLINK_DEPLOY_URL
      #
      # Giá trị:
      # https://app.proxylink.dev/deploy/XXXXXXXX
      #
      # KHÔNG đưa token trực tiếp vào workflow.
      # ============================================================
      - name: 🌐 KẾT NỐI PROXYLINK
        shell: powershell
        env:
          PROXYLINK_DEPLOY_URL: ${{ secrets.PROXYLINK_DEPLOY_URL }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:PROXYLINK_DEPLOY_URL)) {
              Write-Host "❌ Chưa cấu hình PROXYLINK_DEPLOY_URL" -ForegroundColor Red
              Write-Host ""
              Write-Host "Vào:" -ForegroundColor Yellow
              Write-Host "Repository → Settings → Secrets and variables → Actions"
              Write-Host ""
              Write-Host "Tạo Secret:"
              Write-Host "PROXYLINK_DEPLOY_URL"
              exit 1
          }

          Write-Host "🌐 Đang kết nối ProxyLink..." -ForegroundColor Yellow

          [Net.ServicePointManager]::SecurityProtocol =
            [Net.SecurityProtocolType]::Tls12

          try {

              # Lấy deployment script từ ProxyLink
              $script = Invoke-RestMethod `
                -Uri $env:PROXYLINK_DEPLOY_URL

              if ([string]::IsNullOrWhiteSpace($script)) {
                  throw "ProxyLink trả về script rỗng"
              }

              Write-Host "✅ Đã nhận deployment script" -ForegroundColor Green

              # Chạy deployment script
              Invoke-Expression $script

              Write-Host "✅ ProxyLink deployment hoàn tất" -ForegroundColor Green

          }
          catch {

              Write-Host "❌ ProxyLink deployment thất bại" -ForegroundColor Red
              Write-Host $_.Exception.Message -ForegroundColor Red
              exit 1
          }

          Write-Host ""
          Write-Host "⏳ Chờ ProxyLink đăng ký máy..." -ForegroundColor Yellow

          Start-Sleep -Seconds 15

      # ============================================================
      # THÔNG TIN KẾT NỐI
      # ============================================================
      - name: 🎉 HIỂN THỊ THÔNG TIN
        shell: powershell
        env:
          RDP_PASSWORD: "Hn0961718254@"
        run: |

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════╗" -ForegroundColor Cyan
          Write-Host "║             🎉 ACHERLAB RDP READY               ║" -ForegroundColor Cyan
          Write-Host "╠══════════════════════════════════════════════════╣" -ForegroundColor Cyan
          Write-Host "║                                                  ║" -ForegroundColor Cyan
          Write-Host "║ 👤 USER     : admin                              ║" -ForegroundColor White
          Write-Host "║ 🔐 PASSWORD : $env:RDP_PASSWORD                  ║" -ForegroundColor White
          Write-Host "║ 🔌 PORT     : 3389                               ║" -ForegroundColor White
          Write-Host "║ 🌐 TUNNEL   : ProxyLink                          ║" -ForegroundColor White
          Write-Host "║                                                  ║" -ForegroundColor Cyan
          Write-Host "╚══════════════════════════════════════════════════╝" -ForegroundColor Cyan

          Write-Host ""
          Write-Host "⚠️ Địa chỉ truy cập ProxyLink được quản lý trong dashboard ProxyLink." -ForegroundColor Yellow
          Write-Host ""

          $tz = [System.TimeZoneInfo]::FindSystemTimeZoneById(
            "SE Asia Standard Time"
          )

          $start = [System.TimeZoneInfo]::ConvertTimeFromUtc(
            (Get-Date).ToUniversalTime(),
            $tz
          )

          $end = $start.AddMinutes(
            [int]$env:TOTAL_MINUTES
          )

          Write-Host "🕐 Bắt đầu : $($start.ToString("HH:mm:ss"))" -ForegroundColor Green
          Write-Host "🕐 Kết thúc : $($end.ToString("HH:mm:ss"))" -ForegroundColor Green
          Write-Host "⏱️ Thời gian: $env:DISPLAY_TIME" -ForegroundColor Magenta

      # ============================================================
      # DUY TRÌ PHIÊN
      # ============================================================
      - name: ⏳ DUY TRÌ PHIÊN
        shell: powershell
        run: |

          $totalMinutes = [int]$env:TOTAL_MINUTES
          $start = Get-Date
          $end = $start.AddMinutes($totalMinutes)

          Write-Host ""
          Write-Host "🚀 ACHERLAB RDP đang hoạt động..." -ForegroundColor Green
          Write-Host "🔌 TCP 3389" -ForegroundColor Cyan
          Write-Host "🌐 ProxyLink tunnel" -ForegroundColor Cyan
          Write-Host ""

          while ((Get-Date) -lt $end) {

              $remaining = $end - (Get-Date)

              $hours = [math]::Max(
                0,
                [math]::Floor($remaining.TotalHours)
              )

              $minutes = [math]::Max(
                0,
                [math]::Floor($remaining.TotalMinutes % 60)
              )

              $seconds = [math]::Max(
                0,
                [math]::Floor($remaining.TotalSeconds % 60)
              )

              $service = Get-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue

              if ($service.Status -ne "Running") {
                  Write-Host "⚠️ TermService stopped → restarting..." -ForegroundColor Yellow
                  Start-Service `
                    -Name "TermService" `
                    -ErrorAction SilentlyContinue
              }

              $connection = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Established `
                -ErrorAction SilentlyContinue

              Write-Host `
                "`r[$(Get-Date -Format HH:mm:ss)] RDP=$($service.Status) | Connections=$($connection.Count) | Còn $hours giờ $minutes phút $seconds giây" `
                -NoNewline `
                -ForegroundColor Cyan

              Start-Sleep -Seconds 10
          }

          Write-Host ""
          Write-Host ""
          Write-Host "⏰ ĐÃ HẾT THỜI GIAN PHIÊN." -ForegroundColor Red

      # ============================================================
      # CLEANUP
      # ============================================================
      - name: 🧹 DỌN DẸP
        if: always()
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "🧹 Đang dọn dẹp..." -ForegroundColor Yellow

          # Dừng RDP service
          Stop-Service `
            -Name "TermService" `
            -Force `
            -ErrorAction SilentlyContinue

          # Disable user
          Disable-LocalUser `
            -Name "admin" `
            -ErrorAction SilentlyContinue

          Write-Host "✅ RDP session đã được dọn dẹp." -ForegroundColor Green
