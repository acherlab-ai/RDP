name: RDP

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Thoi gian su dung'
        required: false
        default: '5h40m'
        type: choice
        options:
        - '1h'
        - '3h'
        - '5h40m'

jobs:
  RDP-Setup:
    runs-on: windows-latest
    timeout-minutes: 340

    steps:
      # CẤU HÌNH HỆ THỐNG + TẮT PASSWORD POLICY
      - name: Cau hinh he thong
        run: |
          secedit /export /cfg "$env:TEMP\secpol.cfg" /quiet
          (Get-Content "$env:TEMP\secpol.cfg") -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' | Set-Content "$env:TEMP\secpol.cfg"
          secedit /configure /db "$env:TEMP\secedit.sdb" /cfg "$env:TEMP\secpol.cfg" /quiet

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389 profile=any
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

      # TẠO USER ADMIN
      - name: Tao tai khoan admin
        run: |
          $matKhau = "admin@9876543211@@"
          
          # Xoa user cu neu co
          net user admin /delete 2>$null
          
          # Tao user moi (echo Y de xac nhan password > 14 ky tu)
          echo Y | net user admin "$matKhau" /add /expires:never /active:yes
          net localgroup Administrators admin /add 2>$null
          net localgroup "Remote Desktop Users" admin /add 2>$null
          net user admin /passwordchg:no 2>$null
          
          echo "RDP_USER=admin" >> $env:GITHUB_ENV
          echo "RDP_PASS=$matKhau" >> $env:GITHUB_ENV
          Write-Host "Da tao user admin"

      # CÀI NGROK & TẠO TUNNEL
      - name: Thiet lap tunnel ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          $zip = "$env:TEMP\ngrok.zip"
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:TEMP\ngrok" -Force
          Remove-Item $zip -Force
          
          $env:PATH += ";$env:TEMP\ngrok"
          & "$env:TEMP\ngrok\ngrok.exe" config add-authtoken $env:NGROK_AUTHTOKEN
          Start-Process -FilePath "$env:TEMP\ngrok\ngrok.exe" -ArgumentList "tcp","3389" -WindowStyle Hidden
          
          Start-Sleep -Seconds 10
          
          $ngrokUrl = $null
          for ($i = 0; $i -lt 20; $i++) {
              try {
                  $resp = Invoke-WebRequest -Uri "http://127.0.0.1:4040/api/tunnels" -UseBasicParsing -ErrorAction SilentlyContinue
                  $json = $resp.Content | ConvertFrom-Json
                  $ngrokUrl = ($json.tunnels | Select-Object -First 1).public_url
                  if ($ngrokUrl) { break }
              } catch {}
              Start-Sleep -Seconds 2
          }
          
          if ($ngrokUrl) {
              echo "NGROK_URL=$ngrokUrl" >> $env:GITHUB_ENV
              Write-Host "Ngrok URL: $ngrokUrl"
          } else {
              echo "NGROK_URL=KhongLayDuoc" >> $env:GITHUB_ENV
          }

      # HIỂN THỊ THÔNG TIN
      - name: Thong tin ket noi
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "         THONG TIN KET NOI RDP"
          Write-Host "========================================"
          Write-Host "Ngrok URL : $env:NGROK_URL"
          Write-Host "User      : admin"
          Write-Host "Password  : admin@9876543211@@"
          Write-Host "Port      : 3389 (qua ngrok)"
          Write-Host "========================================"

      # DUY TRÌ PHIÊN
      - name: Duy tri phien
        run: |
          $durationInput = "${{ github.event.inputs.duration }}"
          switch ($durationInput) {
              "1h" { $totalMinutes = 60 }
              "3h" { $totalMinutes = 180 }
              "5h40m" { $totalMinutes = 340 }
          }
          
          $thoiGianKetThuc = (Get-Date).AddMinutes($totalMinutes)
          Write-Host "Bat dau: $(Get-Date -Format 'HH:mm:ss')"
          Write-Host "Ket thuc: $($thoiGianKetThuc.ToString('HH:mm:ss'))"
          
          while ((Get-Date) -lt $thoiGianKetThuc) {
              $conLai = $thoiGianKetThuc - (Get-Date)
              Write-Host "`rCon lai: $([math]::Floor($conLai.TotalHours)) gio $([math]::Floor($conLai.TotalMinutes % 60)) phut" -NoNewline
              Start-Sleep -Seconds 30
          }
          
          Write-Host ""
          Write-Host "Het thoi gian!"

      # DỌN DẸP
      - name: Don dep
        if: always()
        run: |
          net user admin /active:no 2>$null
          netsh advfirewall firewall delete rule name="RDP" dir=in 2>$null
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 1 -Force -ErrorAction SilentlyContinue
          Stop-Service -Name TermService -Force -ErrorAction SilentlyContinue
          Get-Process -Name "ngrok" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "Don dep hoan tat!"
