name: RDP PREMIUM EGE

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Session duration"
        required: false
        default: "5h40m"
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h40m"
      rdp_port:
        description: "RDP Port"
        required: false
        default: "3389"
        type: choice
        options:
          - "3389"
          - "3340"
          - "3341"
          - "3350"
          - "3360"
          - "3370"
          - "3390"
          - "3400"
          - "3410"
          - "3420"

jobs:
  RDP:
    runs-on: windows-latest
    timeout-minutes: 340

    steps:
      - name: Setup RDP
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $port = [int]"${{ github.event.inputs.rdp_port }}"
          $pass = $env:RDP_PASSWORD
          if ([string]::IsNullOrWhiteSpace($pass)) {
            $pass = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 12 | ForEach-Object { [char]$_ })
            Write-Host "WARNING: RDP_PASSWORD not set. Using random password: $pass"
            Write-Host "IMPORTANT: Save this password now!"
          }
          Write-Host "Configuring RDP on port $port..."
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "PortNumber" -Value $port -Force
          netsh advfirewall firewall delete rule name="RDP-EGE" 2>$null
          netsh advfirewall firewall add rule name="RDP-EGE" dir=in action=allow protocol=TCP localport=$port profile=any

          $secure = ConvertTo-SecureString $pass -AsPlainText -Force
          $old = Get-LocalUser -Name "admin" -ErrorAction SilentlyContinue
          if ($old) { Remove-LocalUser -Name "admin" -ErrorAction SilentlyContinue }
          New-LocalUser -Name "admin" -Password $secure -AccountNeverExpires -PasswordNeverExpires -Description "RDP Premium"
          Add-LocalGroupMember -Group "Administrators" -Member "admin" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "admin" -ErrorAction SilentlyContinue
          Enable-LocalUser -Name "admin"
          Restart-Service -Name "TermService" -Force
          Start-Sleep -Seconds 3
          $svc = Get-Service -Name "TermService"
          if ($svc.Status -ne "Running") { throw "TermService not running" }
          $listener = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue
          if (-not $listener) { throw "RDP not listening on port $port" }
          Write-Host "RDP ready on port $port"

      - name: Connect WireGuard
        shell: powershell
        env:
          WG_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WG_CONFIG)) { throw "WIREGUARD_CONFIG secret missing" }

          $wgExe = "$env:ProgramFiles\WireGuard\wireguard.exe"
          if (-not (Test-Path $wgExe)) {
            Write-Host "Installing WireGuard..."
            winget install --id WireGuard.WireGuard --exact --silent --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) { throw "WireGuard install failed" }
          }

          $cfg = "$env:TEMP\rdp-wg.conf"
          [System.IO.File]::WriteAllText($cfg, $env:WG_CONFIG, [System.Text.UTF8Encoding]::new($false))

          Write-Host "Installing WireGuard tunnel service..."
          & $wgExe /installtunnelservice $cfg
          if ($LASTEXITCODE -ne 0) { throw "Failed to install tunnel service" }

          Write-Host "Waiting for WireGuard interface..."
          Start-Sleep -Seconds 10

          $configContent = Get-Content $cfg -Raw
          if ($configContent -match "Table\s*=\s*off") {
            Write-Host "Table = off. Adding manual routes via PowerShell..."

            # Lấy IPv4 address (loại bỏ /subnet)
            $ipv4 = ($configContent | Select-String -Pattern "Address\s*=\s*([\d\.]+/\d+)").Matches.Groups[1].Value
            if (-not $ipv4) { throw "No IPv4 address" }
            $ipv4Only = $ipv4 -replace "/\d+", ""

            # Tìm interface WireGuard
            $wgAdapter = Get-NetAdapter | Where-Object { $_.Name -match "WireGuard|wg" -or $_.InterfaceDescription -match "WireGuard" } | Select-Object -First 1
            if (-not $wgAdapter) {
              $iface = Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -eq $ipv4Only } | Select-Object -First 1
              if ($iface) { $wgAdapter = Get-NetAdapter -Name $iface.InterfaceAlias -ErrorAction SilentlyContinue }
            }
            if (-not $wgAdapter) {
              Write-Host "Available adapters:"
              Get-NetAdapter | Format-Table Name, InterfaceDescription, ifIndex, Status
              throw "WireGuard interface not found"
            }
            $ifIndex = $wgAdapter.ifIndex
            Write-Host "Found WireGuard interface: $($wgAdapter.Name) (ifIndex=$ifIndex)"

            # Xóa route cũ (nếu có) và thêm route mới với metric cực thấp
            Remove-NetRoute -DestinationPrefix "0.0.0.0/0" -InterfaceIndex $ifIndex -ErrorAction SilentlyContinue
            New-NetRoute -DestinationPrefix "0.0.0.0/0" -NextHop $ipv4Only -InterfaceIndex $ifIndex -RouteMetric 1 -ErrorAction Stop
            Write-Host "Default route added via $ipv4Only with metric 1."

            # IPv6 nếu có
            $ipv6Match = $configContent | Select-String -Pattern "Address\s*=\s*([a-fA-F0-9:]+/\d+)" -AllMatches
            if ($ipv6Match) {
              $ipv6 = $ipv6Match.Matches[0].Groups[1].Value
              if ($ipv6) {
                $ipv6Only = $ipv6 -replace "/\d+", ""
                Remove-NetRoute -DestinationPrefix "::/0" -InterfaceIndex $ifIndex -ErrorAction SilentlyContinue
                New-NetRoute -DestinationPrefix "::/0" -NextHop $ipv6Only -InterfaceIndex $ifIndex -RouteMetric 1 -ErrorAction SilentlyContinue
              }
            }
          } else {
            Write-Host "WireGuard will add routes automatically."
          }
          Write-Host "WireGuard tunnel started."

      - name: Verify Network Routing
        shell: powershell
        run: |
          Write-Host "=== Network Interfaces ==="
          Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.InterfaceAlias -ne "Loopback" } | Format-Table InterfaceAlias, IPAddress
          Write-Host "=== Default Route ==="
          Get-NetRoute -DestinationPrefix "0.0.0.0/0" | Format-Table InterfaceAlias, NextHop, Metric
          Write-Host "=== Public IP ==="
          try {
            $publicIP = (Invoke-WebRequest -Uri "https://ifconfig.me/ip" -UseBasicParsing -TimeoutSec 10).Content.Trim()
            Write-Host "Public IP: $publicIP"
          } catch {
            Write-Host "Could not fetch public IP: $_"
          }

      - name: RDP Ready
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "          RDP SERVER READY"
          Write-Host "========================================"
          Write-Host "Username : admin"
          Write-Host "Port     : ${{ github.event.inputs.rdp_port }}/TCP"
          Write-Host "Network  : WireGuard (all traffic through tunnel)"
          Write-Host "========================================"

      - name: Keep RDP Alive
        shell: powershell
        run: |
          $port = [int]"${{ github.event.inputs.rdp_port }}"
          $totalMin = @{ "1h"=60; "3h"=180; "5h40m"=340 }["${{ github.event.inputs.duration }}"]
          $end = (Get-Date).AddMinutes($totalMin)
          Write-Host "Keeping RDP alive for $totalMin minutes..."
          while ((Get-Date) -lt $end) {
            $svc = Get-Service -Name "TermService" -ErrorAction SilentlyContinue
            if ($svc.Status -ne "Running") {
              Write-Host "TermService stopped, restarting..."
              Start-Service -Name "TermService" -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 3
            }
            $listener = Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue
            if (-not $listener) {
              Write-Host "RDP port lost, restarting service..."
              Restart-Service -Name "TermService" -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 3
            }
            $remain = $end - (Get-Date)
            Write-Host "RDP active - remaining: $([math]::Floor($remain.TotalHours))h $($remain.Minutes)m $($remain.Seconds)s"
            Start-Sleep -Seconds 60
          }

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Remove-Item "$env:TEMP\rdp-wg.conf" -Force -ErrorAction SilentlyContinue
          Get-Service "WireGuardTunnel*" | Stop-Service -Force -ErrorAction SilentlyContinue
          netsh advfirewall firewall delete rule name="RDP-EGE" 2>$null
          Disable-LocalUser -Name "admin" -ErrorAction SilentlyContinue
          Write-Host "Cleanup completed."
