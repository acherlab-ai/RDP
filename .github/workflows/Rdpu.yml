name: RDP PREMIUM EGE

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Session duration"
        required: false
        default: "5h40m"
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h40m"

jobs:
  RDP:
    runs-on: windows-latest
    timeout-minutes: 340

    steps:

      # ==============================
      # START
      # ==============================
      - name: Start RDP
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "        RDP PREMIUM EGE"
          Write-Host "========================================"
          Write-Host "Duration: ${{ github.event.inputs.duration }}"
          Write-Host "Network: Egret WireGuard"
          Write-Host ""

      # ==============================
      # ENABLE RDP
      # ==============================
      - name: Enable RDP
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP enabled."

      # ==============================
      # FIREWALL
      # ==============================
      - name: Open RDP Port
        shell: powershell
        run: |
          Write-Host "Opening TCP 3389..."

          netsh advfirewall firewall add rule `
            name="RDP-EGE-3389" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            profile=any

          Write-Host "TCP 3389 opened."

      # ==============================
      # CREATE USER
      # ==============================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $username = "admin"
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
              Write-Host "RDP_PASSWORD secret is missing."
              exit 1
          }

          Write-Host "Creating RDP user..."

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $oldUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($oldUser) {
              Remove-LocalUser `
                -Name $username `
                -ErrorAction SilentlyContinue
          }

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "RDP Premium"

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Enable-LocalUser `
            -Name $username

          Write-Host "User created: admin"
          Write-Host "RDP user configuration complete."

      # ==============================
      # CHECK RDP
      # ==============================
      - name: Check RDP
        shell: powershell
        run: |
          Write-Host "Checking RDP..."

          $user = Get-LocalUser `
            -Name "admin" `
            -ErrorAction SilentlyContinue

          if (-not $user) {
              Write-Host "RDP user does not exist."
              exit 1
          }

          Write-Host "User OK."

          $service = Get-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          if ($service.Status -ne "Running") {
              Write-Host "TermService is not running."
              Start-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue
          }

          $listen = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($listen) {
              Write-Host "TCP 3389 is listening."
          }
          else {
              Write-Host "TCP 3389 is NOT listening."
              exit 1
          }

      # ==============================
      # INSTALL WIREGUARD
      # ==============================
      - name: Install WireGuard
        shell: powershell
        run: |
          Write-Host "Installing WireGuard..."

          winget install `
            --id WireGuard.WireGuard `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host "WireGuard installation complete."

      # ==============================
      # CREATE EGRET CONFIG
      # ==============================
      - name: Create Egret Config
        shell: powershell
        env:
          EGRET_CONFIG: ${{ secrets.EGRET_WG_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EGRET_CONFIG)) {
              Write-Host "EGRET_WG_CONFIG secret is missing."
              exit 1
          }

          $configPath = "$env:TEMP\egret.conf"

          [System.IO.File]::WriteAllText(
              $configPath,
              $env:EGRET_CONFIG,
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Egret configuration created."

      # ==============================
      # CONNECT EGRET
      # ==============================
      - name: Connect Eg
