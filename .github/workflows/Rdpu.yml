name: RDP PREMIUM EGE

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Session duration"
        required: false
        default: "5h40m"
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h40m"

      rdp_port:
        description: "RDP Port"
        required: false
        default: "3389"
        type: choice
        options:
          - "3389"
          - "3340"
          - "3341"
          - "3350"
          - "3360"
          - "3370"
          - "3390"
          - "3400"
          - "3410"
          - "3420"

jobs:
  RDP:
    runs-on: windows-latest
    timeout-minutes: 340

    steps:

      - name: Start RDP
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "          RDP PREMIUM EGE"
          Write-Host "========================================"
          Write-Host "Duration : ${{ github.event.inputs.duration }}"
          Write-Host "RDP Port : ${{ github.event.inputs.rdp_port }}"
          Write-Host "Network  : Egret WireGuard"
          Write-Host "Public IP: HIDDEN"
          Write-Host "========================================"

      - name: Enable RDP
        shell: powershell
        run: |
          $port = [int]"${{ github.event.inputs.rdp_port }}"

          Write-Host "Configuring RDP on port ${port}..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "PortNumber" `
            -Value $port `
            -Force

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP configured on TCP ${port}"

      - name: Open RDP Port
        shell: powershell
        run: |
          $port = [int]"${{ github.event.inputs.rdp_port }}"

          Write-Host "Opening firewall TCP ${port}..."

          netsh advfirewall firewall delete rule `
            name="RDP-EGE" `
            2>$null

          netsh advfirewall firewall add rule `
            name="RDP-EGE" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=$port `
            profile=any

          Write-Host "Firewall TCP ${port}: OK"

      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $username = "admin"
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
              Write-Host "ERROR: RDP_PASSWORD secret is missing."
              exit 1
          }

          Write-Host "Creating RDP user..."

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $oldUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($oldUser) {
              Remove-LocalUser `
                -Name $username `
                -ErrorAction SilentlyContinue
          }

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "RDP Premium"

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Enable-LocalUser `
            -Name $username

          Write-Host "User admin created successfully."

      - name: Restart RDP
        shell: powershell
        run: |
          Write-Host "Restarting TermService..."

          Restart-Service `
            -Name "TermService" `
            -Force

          Start-Sleep -Seconds 5

          $service = Get-Service `
            -Name "TermService"

          Write-Host "TermService: $($service.Status)"

          if ($service.Status -ne "Running") {
              Write-Host "ERROR: TermService failed."
              exit 1
          }

      - name: Check RDP
        shell: powershell
        run: |
          $port = [int]"${{ github.event.inputs.rdp_port }}"

          Write-Host "Checking RDP..."

          $user = Get-LocalUser `
            -Name "admin" `
            -ErrorAction SilentlyContinue

          if (-not $user) {
              Write-Host "ERROR: admin user not found."
              exit 1
          }

          Write-Host "User: OK"

          $service = Get-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          if ($service.Status -ne "Running") {
              Write-Host "ERROR: TermService is not running."
              exit 1
          }

          Write-Host "TermService: OK"

          $listen = Get-NetTCPConnection `
            -LocalPort $port `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($listen) {
              Write-Host "TCP ${port}: LISTENING"
          }
          else {
              Write-Host "TCP ${port}: NOT LISTENING"
              exit 1
          }

      - name: Install WireGuard
        shell: powershell
        run: |
          Write-Host "Installing WireGuard..."

          winget install `
            --id WireGuard.WireGuard `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          if ($LASTEXITCODE -ne 0) {
              Write-Host "WireGuard installation failed."
              exit 1
          }

          Write-Host "WireGuard installed."

      - name: Create Egret Config
        shell: powershell
        env:
          EGRET_CONFIG: ${{ secrets.EGRET_WG_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EGRET_CONFIG)) {
              Write-Host "ERROR: EGRET_WG_CONFIG secret is missing."
              exit 1
          }

          $configPath = "$env:TEMP\egret.conf"

          [System.IO.File]::WriteAllText(
              $configPath,
              $env:EGRET_CONFIG,
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Egret configuration created."

      - name: Connect Egret
        shell: powershell
        run: |
          Write-Host "Connecting to Egret WireGuard..."

          $wireguard = "$env:ProgramFiles\WireGuard\wireguard.exe"
          $config = "$env:TEMP\egret.conf"

          if (-not (Test-Path $wireguard)) {
              Write-Host "ERROR: WireGuard executable not found."
              exit 1
          }

          if (-not (Test-Path $config)) {
              Write-Host "ERROR: Egret config not found."
              exit 1
          }

          & $wireguard /installtunnelservice $config

          Start-Sleep -Seconds 10

          Get-Service |
            Where-Object {
              $_.Name -like "WireGuardTunnel*"
            } |
            Select-Object Name, Status |
            Format-Table -AutoSize

          Write-Host "Egret tunnel initialized."

      - name: Test Network
        shell: powershell
        run: |
          Write-Host "Testing network..."

          try {
              $response = Invoke-WebRequest `
                -Uri "https://ifconfig.me/ip" `
                -TimeoutSec 15 `
                -UseBasicParsing

              if ($response.StatusCode -eq 200) {
                  Write-Host "Internet connection: OK"
              }
          }
          catch {
              Write-Host "Network test failed."
              Write-Host $_.Exception.Message
          }

          Write-Host "Public IP: HIDDEN"

      - name: Verify RDP
        shell: powershell
        run: |
          $port = [int]"${{ github.event.inputs.rdp_port }}"

          Write-Host "========================================"
          Write-Host "          FINAL RDP CHECK"
          Write-Host "========================================"

          $service = Get-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "TermService: $($service.Status)"

          if ($service.Status -ne "Running") {
              exit 1
          }

          $listen = Get-NetTCPConnection `
            -LocalPort $port `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($listen) {
              Write-Host "RDP TCP ${port}: LISTENING"
          }
          else {
              Write-Host "RDP TCP ${port}: NOT LISTENING"
              exit 1
          }

          $firewall = Get-NetFirewallRule `
            -DisplayName "RDP-EGE" `
            -ErrorAction SilentlyContinue

          if ($firewall) {
              Write-Host "Firewall: OK"
          }
          else {
              Write-Host "Firewall: NOT FOUND"
              exit 1
          }

      - name: RDP Ready
        shell: powershell
        run: |
          $port = "${{ github.event.inputs.rdp_port }}"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "          RDP SERVER READY"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Username : admin"
          Write-Host "Port     : ${port}/TCP"
          Write-Host "Network  : Egret WireGuard"
          Write-Host "Public IP: HIDDEN"
          Write-Host ""
          Write-Host "RDP is ready."
          Write-Host "========================================"

      - name: Keep RDP Alive
        shell: powershell
        run: |
          $duration = "${{ github.event.inputs.duration }}"
          $port = [int]"${{ github.event.inputs.rdp_port }}"

          switch ($duration) {
              "1h" {
                  $totalMinutes = 60
              }

              "3h" {
                  $totalMinutes = 180
              }

              "5h40m" {
                  $totalMinutes = 340
              }

              default {
                  $totalMinutes = 340
              }
          }

          Write-Host "RDP port: ${port}"
          Write-Host "Duration: ${totalMinutes} minutes"

          $endTime = (Get-Date).AddMinutes($totalMinutes)

          while ((Get-Date) -lt $endTime) {

              $service = Get-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue

              if ($service.Status -ne "Running") {

                  Write-Host "TermService stopped. Restarting..."

                  Start-Service `
                    -Name "TermService" `
                    -ErrorAction SilentlyContinue

                  Start-Sleep -Seconds 3
              }

              $listen = Get-NetTCPConnection `
                -LocalPort $port `
                -State Listen `
                -ErrorAction SilentlyContinue

              if (-not $listen) {

                  Write-Host "RDP port ${port} stopped listening."

                  Restart-Service `
                    -Name "TermService" `
                    -Force `
                    -ErrorAction SilentlyContinue

                  Start-Sleep -Seconds 3
              }

              $remaining = $endTime - (Get-Date)

              $hours = [math]::Floor($remaining.TotalHours)
              $minutesLeft = $remaining.Minutes
              $secondsLeft = $remaining.Seconds

              Write-Host `
                "RDP ${port} active - remaining: ${hours}h ${minutesLeft}m ${secondsLeft}s"

              Start-Sleep -Seconds 30
          }

          Write-Host "RDP session time expired."

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Write-Host "Cleaning up..."

          $config = "$env:TEMP\egret.conf"

          if (Test-Path $config) {
              Remove-Item `
                $config `
                -Force `
                -ErrorAction SilentlyContinue
          }

          $wireguard = "$env:ProgramFiles\WireGuard\wireguard.exe"

          if (Test-Path $wireguard) {

              Get-Service |
                Where-Object {
                  $_.Name -like "WireGuardTunnel*"
                } |
                ForEach-Object {

                  Stop-Service `
                    -Name $_.Name `
                    -Force `
                    -ErrorAction SilentlyContinue
                }
          }

          netsh advfirewall firewall delete rule `
            name="RDP-EGE" `
            2>$null

          Disable-LocalUser `
            -Name "admin" `
            -ErrorAction SilentlyContinue

          Write-Host "Cleanup complete."
