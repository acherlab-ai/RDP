name: Debug Egret WireGuard

on:
  workflow_dispatch:

jobs:
  wireguard-debug:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:

      - name: Install WireGuard
        shell: powershell
        run: |
          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"

          if (Test-Path $wg) {
              Write-Host "WireGuard already installed."
              exit 0
          }

          winget install `
            --id WireGuard.WireGuard `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Start-Sleep -Seconds 5

          if (-not (Test-Path $wg)) {
              Write-Host "WireGuard installation failed."
              exit 1
          }

          Write-Host "WireGuard installed."

      - name: Create Egret Config
        shell: powershell
        env:
          EGRET_CONFIG: ${{ secrets.EGRET_WG_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EGRET_CONFIG)) {
              Write-Host "EGRET_WG_CONFIG is missing."
              exit 1
          }

          $path = "$env:TEMP\egret.conf"

          [System.IO.File]::WriteAllText(
              $path,
              $env:EGRET_CONFIG,
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Config created."

      - name: Connect Egret
        shell: powershell
        run: |
          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"
          $config = "$env:TEMP\egret.conf"
          $name = "egret"
          $serviceName = "WireGuardTunnel`$egret"

          Write-Host "Installing Egret tunnel..."

          $old = Get-Service `
            -Name $serviceName `
            -ErrorAction SilentlyContinue

          if ($old) {
              Write-Host "Removing old tunnel..."

              & $wg `
                /uninstalltunnelservice `
                $name `
                2>&1

              Start-Sleep -Seconds 3
          }

          $p = Start-Process `
            -FilePath $wg `
            -ArgumentList "/installtunnelservice `"$config`"" `
            -PassThru `
            -WindowStyle Hidden

          Write-Host "Installer PID: $($p.Id)"

          if (-not $p.WaitForExit(30000)) {
              Write-Host "Installer timed out."

              Stop-Process `
                -Id $p.Id `
                -Force `
                -ErrorAction SilentlyContinue

              exit 1
          }

          Write-Host "Installer exit code: $($p.ExitCode)"

          if ($p.ExitCode -ne 0) {
              Write-Host "Installation failed."
              exit 1
          }

          Write-Host "Waiting for service..."

          $running = $false

          for ($i = 1; $i -le 30; $i++) {

              $svc = Get-Service `
                -Name $serviceName `
                -ErrorAction SilentlyContinue

              if ($svc) {

                  Write-Host `
                    "Attempt $i/30 - Status: $($svc.Status)"

                  if ($svc.Status -eq "Running") {
                      $running = $true
                      break
                  }

                  if ($svc.Status -eq "Stopped") {
                      break
                  }
              }
              else {
                  Write-Host "Service not found."
              }

              Start-Sleep -Seconds 2
          }

          if ($running) {
              Write-Host "WireGuard service is Running."
          }
          else {
              Write-Host ""
              Write-Host "========================================"
              Write-Host "       WIREGUARD START FAILED"
              Write-Host "========================================"

              Write-Host ""
              Write-Host "Tunnel service:"
              Get-Service `
                -Name $serviceName `
                -ErrorAction SilentlyContinue |
                Format-List *

              Write-Host ""
              Write-Host "WireGuard services:"
              Get-Service |
                Where-Object {
                  $_.Name -like "WireGuard*"
                } |
                Select-Object Name, Status, StartType |
                Format-Table -AutoSize

              Write-Host ""
              Write-Host "WireGuard adapters:"
              Get-NetAdapter |
                Where-Object {
                  $_.InterfaceDescription -like "*WireGuard*"
                } |
                Select-Object `
                  Name,
                  InterfaceDescription,
                  Status,
                  LinkSpeed |
                Format-Table -AutoSize

              Write-Host ""
              Write-Host "IPv4 addresses:"
              Get-NetIPAddress `
                -AddressFamily IPv4 `
                -ErrorAction SilentlyContinue |
                Select-Object `
                  IPAddress,
                  PrefixLength,
                  InterfaceAlias |
                Format-Table -AutoSize

              Write-Host ""
              Write-Host "Relevant routes:"
              Get-NetRoute `
                -AddressFamily IPv4 `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.DestinationPrefix -eq "0.0.0.0/0" -or
                  $_.DestinationPrefix -eq "0.0.0.0/1" -or
                  $_.DestinationPrefix -eq "128.0.0.0/1" -or
                  $_.DestinationPrefix -eq "100.64.252.192/30"
                } |
                Select-Object `
                  DestinationPrefix,
                  NextHop,
                  InterfaceAlias,
                  RouteMetric |
                Format-Table -AutoSize

              Write-Host ""
              Write-Host "WireGuard diagnostic log:"
              & $wg /dumplog 2>&1

              exit 1
          }

      - name: Verify Egret Address
        shell: powershell
        run: |
          Write-Host "Checking 100.64.252.194..."

          $ip = Get-NetIPAddress `
            -AddressFamily IPv4 `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.IPAddress -eq "100.64.252.194"
            }

          if ($ip) {
              Write-Host "Egret address detected."
              $ip |
                Select-Object IPAddress, PrefixLength, InterfaceAlias |
                Format-Table -AutoSize
          }
          else {
              Write-Host "Egret address NOT detected."

              Get-NetIPAddress `
                -AddressFamily IPv4 `
                -ErrorAction SilentlyContinue |
                Select-Object IPAddress, PrefixLength, InterfaceAlias |
                Format-Table -AutoSize

              exit 1
          }

      - name: Test DNS
        shell: powershell
        run: |
          Write-Host "Testing DNS..."

          try {
              Resolve-DnsName `
                -Name example.com `
                -Server 1.1.1.1 `
                -ErrorAction Stop |
                Where-Object {
                  $_.Type -eq "A"
                } |
                Select-Object Name, IPAddress |
                Format-Table -AutoSize

              Write-Host "DNS test completed."
          }
          catch {
              Write-Host "DNS test failed:"
              Write-Host $_.Exception.Message
          }

      - name: Final Diagnostics
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "        FINAL WIREGUARD STATUS"
          Write-Host "========================================"

          Get-Service |
            Where-Object {
              $_.Name -like "WireGuard*"
            } |
            Select-Object Name, Status |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Interfaces:"

          Get-NetAdapter |
            Where-Object {
              $_.InterfaceDescription -like "*WireGuard*"
            } |
            Select-Object Name, Status, InterfaceDescription |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Egret address:"

          Get-NetIPAddress `
            -AddressFamily IPv4 `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.IPAddress -eq "100.64.252.194"
            } |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Relevant routes:"

          Get-NetRoute `
            -AddressFamily IPv4 `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.DestinationPrefix -eq "0.0.0.0/0" -or
              $_.DestinationPrefix -eq "0.0.0.0/1" -or
              $_.DestinationPrefix -eq "128.0.0.0/1"
            } |
            Select-Object `
              DestinationPrefix,
              NextHop,
              InterfaceAlias,
              RouteMetric |
            Format-Table -AutoSize

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"

          if (Test-Path $wg) {
              & $wg `
                /uninstalltunnelservice `
                "egret" `
                2>&1
          }

          Remove-Item `
            "$env:TEMP\egret.conf" `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Cleanup complete."
