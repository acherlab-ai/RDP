name: RDP + WireGuard

on:
  workflow_dispatch:
    inputs:
      rdp_port:
        description: "RDP port"
        required: true
        default: "3389"
        type: string

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_PORT: ${{ inputs.rdp_port }}

    steps:

      # ============================================================
      # 1. BASIC
      # ============================================================
      - name: Setup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "        RDP + WIREGUARD SERVER"
          Write-Host "========================================"

          $port = 0

          if (-not [int]::TryParse("${env:RDP_PORT}", [ref]$port)) {
            throw "Invalid RDP port"
          }

          if ($port -lt 1024 -or $port -gt 65535) {
            throw "Port must be between 1024 and 65535"
          }

          Write-Host "RDP Port: $port"

      # ============================================================
      # 2. CHECK DIRECT INTERNET BEFORE WIREGUARD
      # ============================================================
      - name: Test Direct Internet
        shell: powershell
        run: |
          Write-Host "Testing direct IPv4 Internet..."

          try {
            $r = Invoke-WebRequest `
              -Uri "https://api.ipify.org" `
              -UseBasicParsing `
              -TimeoutSec 10

            Write-Host "Direct IPv4: $($r.Content)"
          }
          catch {
            Write-Warning "Direct IPv4 test failed"
            Write-Warning $_
          }

      # ============================================================
      # 3. ENABLE RDP
      # ============================================================
      - name: Enable RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Start-Service TermService -ErrorAction SilentlyContinue

          Write-Host "RDP enabled."

      # ============================================================
      # 4. CREATE ADMIN USER
      # ============================================================
      - name: Create RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = "admin"
          $password = "${{ secrets.RDP_PASSWORD }}"

          if ([string]::IsNullOrWhiteSpace($password)) {
            throw "RDP_PASSWORD secret is missing"
          }

          $secure = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name $username `
              -Password $secure `
              -PasswordNeverExpires `
              -AccountNeverExpires `
              -UserMayNotChangePassword
          }
          else {
            Set-LocalUser `
              -Name $username `
              -Password $secure
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user ready."

      # ============================================================
      # 5. CONFIGURE RDP PORT
      # ============================================================
      - name: Configure RDP Port
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $port = [int]"${env:RDP_PORT}"

          Write-Host "Configuring RDP port: $port"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "PortNumber" `
            -Type DWord `
            -Value $port

          # Remove old workflow firewall rules
          Get-NetFirewallRule `
            -DisplayName "RDP-EGRET-*" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "RDP-EGRET-$port" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort $port `
            -Action Allow `
            -Profile Any

          Restart-Service TermService -Force

          Write-Host "RDP configured on TCP $port"

      # ============================================================
      # 6. INSTALL WIREGUARD
      # ============================================================
      - name: Install WireGuard
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing WireGuard..."

          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"

          if (-not (Test-Path $wg)) {
            winget install `
              --id WireGuard.WireGuard `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements
          }

          if (-not (Test-Path $wg)) {
            throw "WireGuard installation failed"
          }

          Write-Host "WireGuard installed."

      # ============================================================
      # 7. CREATE CONFIG
      # ============================================================
      - name: Create WireGuard Config
        shell: powershell
        env:
          WG_CONFIG: ${{ secrets.WG_CONFIG }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:WG_CONFIG)) {
            throw "WG_CONFIG secret is missing"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "C:\WireGuard" |
            Out-Null

          $config = "C:\WireGuard\egret.conf"

          $env:WG_CONFIG |
            Set-Content `
              -Path $config `
              -Encoding ASCII

          Write-Host "WireGuard config created."

      # ============================================================
      # 8. CONNECT WIREGUARD
      # ============================================================
      - name: Connect WireGuard
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"
          $config = "C:\WireGuard\egret.conf"

          Write-Host "Connecting WireGuard..."

          # Remove old service if present
          & $wg /uninstalltunnelservice egret 2>$null
          Start-Sleep -Seconds 2

          # Install tunnel
          & $wg /installtunnelservice $config

          if ($LASTEXITCODE -ne 0) {
            throw "WireGuard tunnel installation failed"
          }

          Write-Host "Tunnel service started."

          # Wait max 20 seconds instead of several minutes
          $connected = $false

          for ($i = 1; $i -le 20; $i++) {

            $adapter = Get-NetAdapter |
              Where-Object {
                $_.Name -like "*WireGuard*" -or
                $_.InterfaceDescription -like "*WireGuard*"
              } |
              Where-Object {
                $_.Status -eq "Up"
              }

            if ($adapter) {
              $connected = $true
              Write-Host "WireGuard adapter is UP."
              break
            }

            Start-Sleep -Seconds 1
          }

          if (-not $connected) {
            Write-Warning "WireGuard adapter was not detected as UP."
          }

      # ============================================================
      # 9. VERIFY WIREGUARD
      # ============================================================
      - name: Verify WireGuard
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "        WIREGUARD STATUS"
          Write-Host "========================================"

          & "$env:ProgramFiles\WireGuard\wg.exe" show

          Write-Host ""
          Write-Host "Network adapters:"
          Get-NetAdapter |
            Where-Object {
              $_.InterfaceDescription -like "*WireGuard*"
            } |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "IPv4 addresses:"
          Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object {
              $_.IPAddress -notlike "127.*"
            } |
            Format-Table IPAddress,InterfaceAlias

      # ============================================================
      # 10. TEST WG GATEWAY
      # ============================================================
      - name: Test WireGuard Gateway
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Testing WireGuard gateway..."

          $targets = @(
            "10.77.0.1",
            "100.64.252.193"
          )

          foreach ($target in $targets) {

            Write-Host "Testing $target ..."

            $ok = Test-Connection `
              -ComputerName $target `
              -Count 1 `
              -Quiet `
              -TimeoutSeconds 3

            if ($ok) {
              Write-Host "$target : OK"
            }
            else {
              Write-Warning "$target : FAILED"
            }
          }

      # ============================================================
      # 11. IPV4 TEST
      # ============================================================
      #
      # IMPORTANT:
      # Full-tunnel WireGuard only gives Internet if the WireGuard
      # server performs IPv4 forwarding/NAT.
      #
      # Therefore this test NEVER stops the RDP job.
      #
      # ============================================================
      - name: Test IPv4 Internet Through Tunnel
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Testing IPv4 Internet through WireGuard..."

          try {

            $r = Invoke-WebRequest `
              -Uri "https://api.ipify.org" `
              -UseBasicParsing `
              -TimeoutSec 10

            Write-Host "Tunnel IPv4: $($r.Content)"
          }
          catch {

            Write-Warning "IPv4 Internet through WireGuard is unavailable."
            Write-Warning "This normally means the WG peer does not provide NAT/Internet."
            Write-Warning "RDP tunnel can still work."
          }

      # ============================================================
      # 12. TEST LOCAL RDP
      # ============================================================
      - name: Test Local RDP
        shell: powershell
        run: |
          $port = [int]"${env:RDP_PORT}"

          Write-Host "Testing local RDP on $port..."

          $result = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port $port `
            -WarningAction SilentlyContinue

          if ($result.TcpTestSucceeded) {
            Write-Host "RDP $port : LISTENING"
          }
          else {
            throw "RDP port $port is NOT listening"
          }

      # ============================================================
      # 13. TEST WG IP -> RDP
      # ============================================================
      - name: Test RDP Through WireGuard
        shell: powershell
        run: |
          $port = [int]"${env:RDP_PORT}"

          $ips = @(
            "10.77.1.7",
            "100.64.252.194"
          )

          foreach ($ip in $ips) {

            Write-Host "Testing $ip`:$port ..."

            $result = Test-NetConnection `
              -ComputerName $ip `
              -Port $port `
              -WarningAction SilentlyContinue

            if ($result.TcpTestSucceeded) {
              Write-Host "$ip`:$port : OK"
            }
            else {
              Write-Warning "$ip`:$port : FAILED"
            }
          }

      # ============================================================
      # 14. SHOW PORT
      # ============================================================
      - name: RDP READY
        shell: powershell
        run: |
          $port = [int]"${env:RDP_PORT}"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "          RDP SERVER READY"
          Write-Host "========================================"
          Write-Host "Username : admin"
          Write-Host "Port     : $port/TCP"
          Write-Host "Network  : WireGuard"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Connect with:"
          Write-Host "WG_IP:$port"
          Write-Host ""

      # ============================================================
      # 15. KEEP ALIVE
      # ============================================================
      - name: Keep RDP Alive
        shell: powershell
        run: |
          $duration = 340
          $end = (Get-Date).AddMinutes($duration)

          Write-Host "RDP session will remain active for $duration minutes."

          while ((Get-Date) -lt $end) {

            $port = [int]"${env:RDP_PORT}"

            $test = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port $port `
              -WarningAction SilentlyContinue

            $remaining = $end - (Get-Date)

            if ($test.TcpTestSucceeded) {
              Write-Host (
                "RDP $port LISTENING | Remaining: {0:hh\:mm\:ss}" -f $remaining
              )
            }
            else {
              Write-Warning "RDP $port is not listening."
            }

            Start-Sleep -Seconds 30
          }

      # ============================================================
      # 16. CLEANUP
      # ============================================================
      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Write-Host "Cleaning up WireGuard..."

          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"

          if (Test-Path $wg) {
            & $wg /uninstalltunnelservice egret 2>$null
          }

          Write-Host "Cleanup complete."
