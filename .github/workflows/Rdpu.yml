name: RDP PREMIUM EGE

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Session duration"
        required: false
        default: "5h40m"
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h40m"

jobs:
  RDP:
    runs-on: windows-latest
    timeout-minutes: 340

    steps:

      # ==============================
      # START
      # ==============================
      - name: Start RDP
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "        RDP PREMIUM EGE"
          Write-Host "========================================"
          Write-Host "Duration: ${{ github.event.inputs.duration }}"
          Write-Host "Network: Egret WireGuard"
          Write-Host ""

      # ==============================
      # ENABLE RDP
      # ==============================
      - name: Enable RDP
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP enabled."

      # ==============================
      # FIREWALL
      # ==============================
      - name: Open RDP Port
        shell: powershell
        run: |
          Write-Host "Opening TCP 3389..."

          netsh advfirewall firewall add rule `
            name="RDP-EGE-3389" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            profile=any

          Write-Host "TCP 3389 opened."

      # ==============================
      # CREATE USER
      # ==============================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $username = "admin"
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
              Write-Host "RDP_PASSWORD secret is missing."
              exit 1
          }

          Write-Host "Creating RDP user..."

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $oldUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($oldUser) {
              Remove-LocalUser `
                -Name $username `
                -ErrorAction SilentlyContinue
          }

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "RDP Premium"

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Enable-LocalUser `
            -Name $username

          Write-Host "User created: admin"
          Write-Host "RDP user configuration complete."

      # ==============================
      # CHECK RDP
      # ==============================
      - name: Check RDP
        shell: powershell
        run: |
          Write-Host "Checking RDP..."

          $user = Get-LocalUser `
            -Name "admin" `
            -ErrorAction SilentlyContinue

          if (-not $user) {
              Write-Host "RDP user does not exist."
              exit 1
          }

          Write-Host "User OK."

          $service = Get-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          if ($service.Status -ne "Running") {
              Write-Host "TermService is not running."
              Start-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue
          }

          $listen = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($listen) {
              Write-Host "TCP 3389 is listening."
          }
          else {
              Write-Host "TCP 3389 is NOT listening."
              exit 1
          }

      # ==============================
      # INSTALL WIREGUARD
      # ==============================
      - name: Install WireGuard
        shell: powershell
        run: |
          Write-Host "Installing WireGuard..."

          winget install `
            --id WireGuard.WireGuard `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host "WireGuard installation complete."

      # ==============================
      # CREATE EGRET CONFIG
      # ==============================
      - name: Create Egret Config
        shell: powershell
        env:
          EGRET_CONFIG: ${{ secrets.EGRET_WG_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EGRET_CONFIG)) {
              Write-Host "EGRET_WG_CONFIG secret is missing."
              exit 1
          }

          $configPath = "$env:TEMP\egret.conf"

          [System.IO.File]::WriteAllText(
              $configPath,
              $env:EGRET_CONFIG,
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Egret configuration created."

      # ==============================
      # CONNECT EGRET
      # ==============================
      - name: Connect Egret
        shell: powershell
        run: |
          Write-Host "Connecting to Egret WireGuard..."

          $wireguard = "$env:ProgramFiles\WireGuard\wireguard.exe"
          $config = "$env:TEMP\egret.conf"

          if (-not (Test-Path $wireguard)) {
              Write-Host "WireGuard executable not found."
              exit 1
          }

          if (-not (Test-Path $config)) {
              Write-Host "Egret config not found."
              exit 1
          }

          & $wireguard /installtunnelservice $config

          Start-Sleep -Seconds 10

          Write-Host "Checking WireGuard services..."

          Get-Service |
            Where-Object {
              $_.Name -like "WireGuardTunnel*"
            } |
            Select-Object Name, Status |
            Format-Table -AutoSize

          Write-Host "Egret connection initialized."

      # ==============================
      # TEST INTERNET
      # ==============================
      - name: Test Egret Internet
        shell: powershell
        run: |
          Write-Host "Testing Internet through Egret..."

          try {
              $response = Invoke-WebRequest `
                -Uri "https://ifconfig.me/ip" `
                -TimeoutSec 15 `
                -UseBasicParsing

              if ($response.StatusCode -eq 200) {
                  Write-Host "Egret Internet connection: OK"
              }
              else {
                  Write-Host "Internet test returned an unexpected status."
              }
          }
          catch {
              Write-Host "Internet test failed."
              Write-Host $_.Exception.Message
          }

          # Public IP is intentionally NOT printed.

      # ==============================
      # CHECK RDP AGAIN
      # ==============================
      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "Verifying RDP..."

          $service = Get-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "TermService: $($service.Status)"

          $listen = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($listen) {
              Write-Host "RDP TCP 3389: LISTENING"
          }
          else {
              Write-Host "RDP TCP 3389: NOT LISTENING"
              exit 1
          }

          $firewall = Get-NetFirewallRule `
            -DisplayName "RDP-EGE-3389" `
            -ErrorAction SilentlyContinue

          if ($firewall) {
              Write-Host "Firewall rule: OK"
          }
          else {
              Write-Host "Firewall rule not found."
          }

      # ==============================
      # READY
      # ==============================
      - name: RDP Ready
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "           RDP SERVER READY"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Username : admin"
          Write-Host "Port     : 3389/TCP"
          Write-Host "Network  : Egret WireGuard"
          Write-Host "Public IP: HIDDEN"
          Write-Host ""
          Write-Host "Use the Egret public IP with port 3389."
          Write-Host ""

      # ==============================
      # KEEP ALIVE
      # ==============================
      - name: Keep RDP Alive
        shell: powershell
        run: |
          $duration = "${{ github.event.inputs.duration }}"

          switch ($duration) {
              "1h" {
                  $minutes = 60
              }

              "3h" {
                  $minutes = 180
              }

              "5h40m" {
                  $minutes = 340
              }

              default {
                  $minutes = 340
              }
          }

          Write-Host "RDP session duration: $minutes minutes."

          $endTime = (Get-Date).AddMinutes($minutes)

          while ((Get-Date) -lt $endTime) {

              $service = Get-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue

              if ($service.Status -ne "Running") {
                  Write-Host "TermService stopped. Restarting..."

                  Start-Service `
                    -Name "TermService" `
                    -ErrorAction SilentlyContinue
              }

              $remaining = $endTime - (Get-Date)

              $hours = [math]::Floor($remaining.TotalHours)
              $minutesLeft = $remaining.Minutes
              $secondsLeft = $remaining.Seconds

              Write-Host `
                "RDP active - remaining: ${hours}h ${minutesLeft}m ${secondsLeft}s"

              Start-Sleep -Seconds 30
          }

          Write-Host "RDP session time expired."

      # ==============================
      # CLEANUP
      # ==============================
      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Write-Host "Cleaning up..."

          $config = "$env:TEMP\egret.conf"

          if (Test-Path $config) {
              Remove-Item `
                $config `
                -Force `
                -ErrorAction SilentlyContinue
          }

          $wireguard = "$env:ProgramFiles\WireGuard\wireguard.exe"

          if (Test-Path $wireguard) {

              Get-Service |
                Where-Object {
                  $_.Name -like "WireGuardTunnel*"
                } |
                ForEach-Object {

                  Stop-Service `
                    -Name $_.Name `
                    -Force `
                    -ErrorAction SilentlyContinue
                }
          }

          netsh advfirewall firewall delete rule `
            name="RDP-EGE-3389" `
            2>$null

          Disable-LocalUser `
            -Name "admin" `
            -ErrorAction SilentlyContinue

          Write-Host "Cleanup complete."
