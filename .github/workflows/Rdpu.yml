name: RDP + WireGuard

on:
  workflow_dispatch:
    inputs:
      rdp_port:
        description: "RDP port"
        required: true
        default: "3389"
        type: string

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_PORT: ${{ inputs.rdp_port }}

    steps:

      # ============================================================
      # 1. BASIC
      # ============================================================
      - name: Setup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "        RDP + WIREGUARD SERVER"
          Write-Host "========================================"

          $port = 0

          if (-not [int]::TryParse("${env:RDP_PORT}", [ref]$port)) {
            throw "Invalid RDP port"
          }

          if ($port -lt 1024 -or $port -gt 65535) {
            throw "Port must be between 1024 and 65535"
          }

          Write-Host "RDP Port: $port"

      # ============================================================
      # 2. CHECK DIRECT INTERNET BEFORE WIREGUARD
      # ============================================================
      - name: Test Direct Internet
        shell: powershell
        run: |
          Write-Host "Testing direct IPv4 Internet..."

          try {
            $r = Invoke-WebRequest `
              -Uri "https://api.ipify.org" `
              -UseBasicParsing `
              -TimeoutSec 10

            Write-Host "Direct IPv4: $($r.Content)"
          }
          catch {
            Write-Warning "Direct IPv4 test failed"
            Write-Warning $_
          }

      # ============================================================
      # 3. ENABLE RDP
      # ============================================================
      - name: Enable RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Start-Service TermService -ErrorAction SilentlyContinue

          Write-Host "RDP enabled."

      # ============================================================
      # 4. CREATE ADMIN USER
      # ============================================================
      - name: Create RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = "admin"
          $password = "${{ secrets.RDP_PASSWORD }}"

          if ([string]::IsNullOrWhiteSpace($password)) {
            throw "RDP_PASSWORD secret is missing"
          }

          $secure = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name $username `
              -Password $secure `
              -PasswordNeverExpires `
              -AccountNeverExpires `
              -UserMayNotChangePassword
          }
          else {
            Set-LocalUser `
              -Name $username `
              -Password $secure
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user ready."

      # ============================================================
      # 5. CONFIGURE RDP PORT
      # ============================================================
      - name: Configure RDP Port
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $port = [int]"${env:RDP_PORT}"

          Write-Host "Configuring RDP port: $port"

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "PortNumber" `
            -Type DWord `
            -Value $port

          # Remove old workflow firewall rules
          Get-NetFirewallRule `
            -DisplayName "RDP-EGRET-*" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "RDP-EGRET-$port" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort $port `
            -Action Allow `
            -Profile Any

          Restart-Service TermService -Force

          Write-Host "RDP configured on TCP $port"

      # ============================================================
      # 6. INSTALL WIREGUARD - FIXED
      # ============================================================
      - name: Install WireGuard
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          
          Write-Host "Installing WireGuard..."

          # Check if WireGuard is already installed
          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"
          
          if (-not (Test-Path $wg)) {
            Write-Host "WireGuard not found, downloading..."
            
            # Download WireGuard MSI directly
            $url = "https://download.wireguard.com/windows-client/wireguard-amd64-0.5.3.msi"
            $msi = "$env:TEMP\wireguard.msi"
            
            Invoke-WebRequest -Uri $url -OutFile $msi -UseBasicParsing
            
            # Install silently
            Start-Process msiexec.exe -Wait -ArgumentList "/i `"$msi`" /quiet /norestart" -PassThru
            
            # Wait for installation to complete
            Start-Sleep -Seconds 5
          }

          # Verify installation
          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"
          if (-not (Test-Path $wg)) {
            Write-Host "Trying alternative path..."
            $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"
          }

          if (Test-Path $wg) {
            Write-Host "WireGuard installed at: $wg"
            & $wg --version
          } else {
            throw "WireGuard installation failed - binary not found"
          }

      # ============================================================
      # 7. CREATE CONFIG - FIXED
      # ============================================================
      - name: Create WireGuard Config
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Creating WireGuard config..."

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "C:\WireGuard" |
            Out-Null

          $config = "C:\WireGuard\egret.conf"

          # Create a valid WireGuard config
          $wgConfig = @"
[Interface]
PrivateKey = gBSqCjmdyosbZBbOKN2XhgDHJSvc5cS9DXeAnwzLB2c=
Address = 100.64.252.194/30
DNS = 1.1.1.1

[Peer]
PublicKey = oiEV8WWaG4Y8IrmAhySpKi9L2K5Xv5wJ1O+OsLOv1lc=
AllowedIPs = 0.0.0.0/0
Endpoint = 23.154.9.27:20106
PersistentKeepalive = 15
"@

          $wgConfig | Set-Content -Path $config -Encoding ASCII

          Write-Host "WireGuard config created at: $config"
          
          # Display config for debugging
          Get-Content $config

      # ============================================================
      # 8. CONNECT WIREGUARD - FIXED
      # ============================================================
      - name: Connect WireGuard
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          
          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"
          $config = "C:\WireGuard\egret.conf"

          Write-Host "Connecting WireGuard..."

          # List current tunnels
          Write-Host "Current tunnels:"
          & $wg /showtunnels 2>$null

          # Remove old service if present
          Write-Host "Removing old tunnel if exists..."
          & $wg /uninstalltunnelservice egret 2>$null
          Start-Sleep -Seconds 3

          # Try to install tunnel with more verbose output
          Write-Host "Installing tunnel service..."
          $process = Start-Process -FilePath $wg -ArgumentList "/installtunnelservice `"$config`"" -Wait -PassThru -NoNewWindow
          
          $exitCode = $process.ExitCode
          Write-Host "WireGuard exit code: $exitCode"
          
          if ($exitCode -ne 0) {
            Write-Warning "WireGuard tunnel installation returned exit code: $exitCode"
            
            # Try alternative installation method
            Write-Host "Trying alternative installation method..."
            $tempService = "$env:TEMP\wgservice.ps1"
            
            @"
`$wg = "$env:ProgramFiles\WireGuard\wireguard.exe"
`$config = "C:\WireGuard\egret.conf"
& `$wg /installtunnelservice `$config
"@ | Set-Content -Path $tempService -Encoding ASCII
            
            & powershell -ExecutionPolicy Bypass -File $tempService
          }

          Start-Sleep -Seconds 5

          # Check if service is running
          $service = Get-Service -Name "WireGuardTunnel`$egret" -ErrorAction SilentlyContinue
          if ($service) {
            Write-Host "Service status: $($service.Status)"
            if ($service.Status -eq 'Stopped') {
              Start-Service -Name "WireGuardTunnel`$egret" -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 3
            }
          }

          # Wait for adapter
          $connected = $false
          for ($i = 1; $i -le 20; $i++) {
            $adapter = Get-NetAdapter |
              Where-Object {
                $_.Name -like "*WireGuard*" -or
                $_.InterfaceDescription -like "*WireGuard*"
              } |
              Where-Object {
                $_.Status -eq "Up"
              }

            if ($adapter) {
              $connected = $true
              Write-Host "WireGuard adapter is UP: $($adapter.Name)"
              break
            }

            Start-Sleep -Seconds 1
          }

          if (-not $connected) {
            Write-Warning "WireGuard adapter was not detected as UP."
            
            # Show all adapters for debugging
            Write-Host "All network adapters:"
            Get-NetAdapter | Format-Table Name, InterfaceDescription, Status
          }

      # ============================================================
      # 9. VERIFY WIREGUARD
      # ============================================================
      - name: Verify WireGuard
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "        WIREGUARD STATUS"
          Write-Host "========================================"

          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"
          
          if (Test-Path $wg) {
            & $wg show
          }

          Write-Host ""
          Write-Host "Network adapters:"
          Get-NetAdapter |
            Where-Object {
              $_.InterfaceDescription -like "*WireGuard*"
            } |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "IPv4 addresses:"
          Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object {
              $_.IPAddress -notlike "127.*"
            } |
            Format-Table IPAddress,InterfaceAlias

      # ============================================================
      # 10. TEST WG GATEWAY
      # ============================================================
      - name: Test WireGuard Gateway
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "Testing WireGuard gateway..."

          $targets = @(
            "100.64.252.193",
            "1.1.1.1"
          )

          foreach ($target in $targets) {
            Write-Host "Testing $target ..."
            $ok = Test-Connection -ComputerName $target -Count 1 -Quiet -TimeoutSeconds 3
            if ($ok) {
              Write-Host "$target : OK"
            } else {
              Write-Warning "$target : FAILED"
            }
          }

      # ============================================================
      # 11. TEST LOCAL RDP
      # ============================================================
      - name: Test Local RDP
        shell: powershell
        run: |
          $port = [int]"${env:RDP_PORT}"

          Write-Host "Testing local RDP on $port..."

          $result = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port $port `
            -WarningAction SilentlyContinue

          if ($result.TcpTestSucceeded) {
            Write-Host "RDP $port : LISTENING"
          } else {
            throw "RDP port $port is NOT listening"
          }

      # ============================================================
      # 12. SHOW PORT
      # ============================================================
      - name: RDP READY
        shell: powershell
        run: |
          $port = [int]"${env:RDP_PORT}"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "          RDP SERVER READY"
          Write-Host "========================================"
          Write-Host "Username : admin"
          Write-Host "Port     : $port/TCP"
          Write-Host "Network  : WireGuard"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Connect with:"
          Write-Host "100.64.252.194:$port"
          Write-Host ""

      # ============================================================
      # 13. KEEP ALIVE
      # ============================================================
      - name: Keep RDP Alive
        shell: powershell
        run: |
          $duration = 340
          $end = (Get-Date).AddMinutes($duration)

          Write-Host "RDP session will remain active for $duration minutes."

          while ((Get-Date) -lt $end) {
            $port = [int]"${env:RDP_PORT}"
            $test = Test-NetConnection -ComputerName "127.0.0.1" -Port $port -WarningAction SilentlyContinue
            $remaining = $end - (Get-Date)

            if ($test.TcpTestSucceeded) {
              Write-Host ("RDP $port LISTENING | Remaining: {0:hh\:mm\:ss}" -f $remaining)
            } else {
              Write-Warning "RDP $port is not listening."
            }

            Start-Sleep -Seconds 30
          }

      # ============================================================
      # 14. CLEANUP
      # ============================================================
      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Write-Host "Cleaning up WireGuard..."
          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"
          if (Test-Path $wg) {
            & $wg /uninstalltunnelservice egret 2>$null
          }
          Write-Host "Cleanup complete."
