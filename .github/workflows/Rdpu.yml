name: RDP PREMIUM EGE

on:
  workflow_dispatch:
    inputs:

      duration:
        description: "Thời gian chạy"
        required: true
        default: "5h40m"
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h40m"

      rdp_port:
        description: "RDP Port"
        required: true
        default: "3389"
        type: choice
        options:
          - "3389"
          - "3340"
          - "3341"
          - "3350"
          - "3360"
          - "3370"
          - "3390"
          - "3400"
          - "3410"
          - "3420"


jobs:

  RDP:
    runs-on: windows-latest
    timeout-minutes: 340

    steps:

      # ==========================================
      # START
      # ==========================================

      - name: START RDP
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "          RDP PREMIUM EGE"
          Write-Host "========================================"
          Write-Host "Duration : ${{ github.event.inputs.duration }}"
          Write-Host "RDP Port : ${{ github.event.inputs.rdp_port }}"
          Write-Host "Network  : Egret WireGuard"
          Write-Host "========================================"
          Write-Host ""


      # ==========================================
      # ENABLE RDP
      # ==========================================

      - name: Enable RDP
        shell: powershell
        run: |

          $port = [int]"${{ github.event.inputs.rdp_port }}"

          Write-Host "Configuring RDP on TCP ${port}..."

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "PortNumber" `
            -Value $port `
            -Force

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP configured."


      # ==========================================
      # FIREWALL
      # ==========================================

      - name: Configure Firewall
        shell: powershell
        run: |

          $port = [int]"${{ github.event.inputs.rdp_port }}"

          Write-Host "Opening TCP ${port}..."

          Get-NetFirewallRule `
            -DisplayName "EGE-RDP-*" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "EGE-RDP-${port}" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort $port `
            -Action Allow `
            -Profile Any

          Write-Host "Firewall TCP ${port}: OK"


      # ==========================================
      # CREATE ADMIN
      # ==========================================

      - name: Create RDP Admin
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          $username = "admin"
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
              Write-Host "RDP_PASSWORD secret is missing."
              exit 1
          }

          Write-Host "Creating admin user..."

          $oldUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($oldUser) {

              Remove-LocalUser `
                -Name $username `
                -ErrorAction SilentlyContinue
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "RDP Premium Admin"

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Enable-LocalUser `
            -Name $username

          Write-Host "Admin user ready."


      # ==========================================
      # INSTALL WIREGUARD
      # ==========================================

      - name: Install WireGuard
        shell: powershell
        run: |

          Write-Host "Installing WireGuard..."

          winget install `
            --id WireGuard.WireGuard `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          if ($LASTEXITCODE -ne 0) {
              Write-Host "WireGuard installation failed."
              exit 1
          }

          Write-Host "WireGuard installed."


      # ==========================================
      # CREATE EGRET CONFIG
      # ==========================================

      - name: Create Egret WireGuard Config
        shell: powershell
        env:
          EGRET_CONFIG: ${{ secrets.EGRET_WG_CONFIG }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:EGRET_CONFIG)) {
              Write-Host "EGRET_WG_CONFIG secret is missing."
              exit 1
          }

          $configPath = "$env:TEMP\egret.conf"

          [System.IO.File]::WriteAllText(
              $configPath,
              $env:EGRET_CONFIG,
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Egret config created."


      # ==========================================
      # CONNECT EGRET
      # ==========================================

      - name: Connect Egret
        shell: powershell
        run: |

          $wireguard = "$env:ProgramFiles\WireGuard\wireguard.exe"
          $config = "$env:TEMP\egret.conf"

          if (-not (Test-Path $wireguard)) {
              Write-Host "WireGuard executable not found."
              exit 1
          }

          if (-not (Test-Path $config)) {
              Write-Host "Egret config not found."
              exit 1
          }

          Write-Host "Connecting Egret..."

          & $wireguard /installtunnelservice $config

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "WireGuard services:"

          Get-Service |
            Where-Object {
              $_.Name -like "WireGuardTunnel*"
            } |
            Select-Object Name, Status |
            Format-Table -AutoSize


      # ==========================================
      # CHECK EGRET NETWORK
      # ==========================================

      - name: Check Egret Tunnel
        shell: powershell
        run: |

          Write-Host "Checking WireGuard interface..."

          Get-NetAdapter |
            Where-Object {
              $_.InterfaceDescription -like "*WireGuard*"
            } |
            Select-Object Name, Status, MacAddress |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "IP configuration:"

          Get-NetIPConfiguration |
            Select-Object InterfaceAlias, IPv4Address, IPv4DefaultGateway |
            Format-Table -AutoSize


      # ==========================================
      # CHECK RDP
      # ==========================================

      - name: Verify RDP
        shell: powershell
        run: |

          $port = [int]"${{ github.event.inputs.rdp_port }}"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "          FINAL RDP CHECK"
          Write-Host "========================================"

          $service = Get-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "TermService: $($service.Status)"

          if ($service.Status -ne "Running") {

              Write-Host "Starting TermService..."

              Start-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 3
          }

          $listen = Get-NetTCPConnection `
            -LocalPort $port `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($listen) {

              Write-Host "RDP TCP ${port}: LISTENING"

          }
          else {

              Write-Host "RDP TCP ${port}: NOT LISTENING"
              exit 1
          }

          Write-Host ""

          Write-Host "Local TCP test:"

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port $port `
            -WarningAction SilentlyContinue

          if ($test.TcpTestSucceeded) {

              Write-Host "TCP ${port}: OK"

          }
          else {

              Write-Host "TCP ${port}: FAILED"
              exit 1
          }

          Write-Host ""
          Write-Host "Firewall rule:"

          Get-NetFirewallRule `
            -DisplayName "EGE-RDP-${port}" `
            -ErrorAction SilentlyContinue |
            Select-Object DisplayName, Enabled, Direction, Action |
            Format-Table -AutoSize


      # ==========================================
      # READY
      # ==========================================

      - name: RDP READY
        shell: powershell
        run: |

          $port = "${{ github.event.inputs.rdp_port }}"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "            RDP READY"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Username : admin"
          Write-Host "Port     : ${port}"
          Write-Host "Network  : Egret"
          Write-Host "Public IP: HIDDEN"
          Write-Host ""
          Write-Host "Connect using:"
          Write-Host "EGRET_PUBLIC_IP:${port}"
          Write-Host ""
          Write-Host "========================================"


      # ==========================================
      # KEEP ALIVE
      # ==========================================

      - name: Keep RDP Alive
        shell: powershell
        run: |

          $port = [int]"${{ github.event.inputs.rdp_port }}"
          $duration = "${{ github.event.inputs.duration }}"

          switch ($duration) {

              "1h" {
                  $totalMinutes = 60
              }

              "3h" {
                  $totalMinutes = 180
              }

              "5h40m" {
                  $totalMinutes = 340
              }

              default {
                  $totalMinutes = 340
              }
          }

          Write-Host ""
          Write-Host "RDP port: ${port}"
          Write-Host "Duration: ${totalMinutes} minutes"
          Write-Host ""

          $endTime = (Get-Date).AddMinutes($totalMinutes)

          while ((Get-Date) -lt $endTime) {

              $service = Get-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue

              if ($service.Status -ne "Running") {

                  Write-Host "TermService stopped."

                  Start-Service `
                    -Name "TermService" `
                    -ErrorAction SilentlyContinue
              }

              $listen = Get-NetTCPConnection `
                -LocalPort $port `
                -State Listen `
                -ErrorAction SilentlyContinue

              if (-not $listen) {

                  Write-Host "RDP ${port} is not listening."

                  Restart-Service `
                    -Name "TermService" `
                    -Force `
                    -ErrorAction SilentlyContinue

                  Start-Sleep -Seconds 5
              }

              $remaining = $endTime - (Get-Date)

              $hours = [math]::Floor(
                  $remaining.TotalHours
              )

              $minutesLeft = $remaining.Minutes
              $secondsLeft = $remaining.Seconds

              Write-Host `
                "RDP ${port} | ${hours}h ${minutesLeft}m ${secondsLeft}s remaining"

              Start-Sleep -Seconds 30
          }

          Write-Host ""
          Write-Host "RDP session expired."


      # ==========================================
      # CLEANUP
      # ==========================================

      - name: Cleanup
        if: always()
        shell: powershell
        run: |

          Write-Host "Cleaning up..."

          $config = "$env:TEMP\egret.conf"

          if (Test-Path $config) {

              Remove-Item `
                $config `
                -Force `
                -ErrorAction SilentlyContinue
          }

          $wireguard = "$env:ProgramFiles\WireGuard\wireguard.exe"

          if (Test-Path $wireguard) {

              Get-Service |
                Where-Object {
                  $_.Name -like "WireGuardTunnel*"
                } |
                ForEach-Object {

                  Stop-Service `
                    -Name $_.Name `
                    -Force `
                    -ErrorAction SilentlyContinue
                }
          }

          Get-NetFirewallRule `
            -DisplayName "EGE-RDP-*" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule `
            -ErrorAction SilentlyContinue

          Disable-LocalUser `
            -Name "admin" `
            -ErrorAction SilentlyContinue

          Write-Host "Cleanup complete."
