name: RDP PREMIUM EGE

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Session duration"
        required: false
        default: "5h40m"
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h40m"

      rdp_port:
        description: "RDP public/listen port (1024-65535)"
        required: true
        default: "3389"
        type: string

jobs:
  RDP:
    runs-on: windows-latest
    timeout-minutes: 340

    steps:

      # ==============================
      # CHECK PORT
      # ==============================
      - name: Validate RDP Port
        shell: powershell
        run: |
          $port = "${{ github.event.inputs.rdp_port }}"

          Write-Host "Requested RDP port: $port"

          if ($port -notmatch '^\d+$') {
              Write-Host "ERROR: Port must be a number."
              exit 1
          }

          $portNumber = [int]$port

          if ($portNumber -lt 1024 -or $portNumber -gt 65535) {
              Write-Host "ERROR: Port must be between 1024 and 65535."
              exit 1
          }

          Write-Host "Port is valid: $portNumber"

      # ==============================
      # START
      # ==============================
      - name: Start RDP
        shell: powershell
        run: |
          $port = "${{ github.event.inputs.rdp_port }}"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "        RDP PREMIUM EGE"
          Write-Host "========================================"
          Write-Host "Duration: ${{ github.event.inputs.duration }}"
          Write-Host "RDP Port: $port"
          Write-Host "Internal RDP: 3389"
          Write-Host "Network: Egret WireGuard"
          Write-Host ""

      # ==============================
      # ENABLE RDP
      # ==============================
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP enabled."

      # ==============================
      # CREATE USER
      # ==============================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $username = "admin"
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
              Write-Host "RDP_PASSWORD secret is missing."
              exit 1
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $oldUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($oldUser) {
              Remove-LocalUser `
                -Name $username `
                -ErrorAction SilentlyContinue
          }

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "RDP Premium"

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Enable-LocalUser `
            -Name $username

          Write-Host "RDP user created."

      # ==============================
      # INSTALL WIREGUARD
      # ==============================
      - name: Install WireGuard
        shell: powershell
        run: |
          winget install `
            --id WireGuard.WireGuard `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host "WireGuard installation complete."

      # ==============================
      # CREATE EGRET CONFIG
      # ==============================
      - name: Create Egret Config
        shell: powershell
        env:
          EGRET_CONFIG: ${{ secrets.EGRET_WG_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EGRET_CONFIG)) {
              Write-Host "EGRET_WG_CONFIG secret is missing."
              exit 1
          }

          $configPath = "$env:TEMP\egret.conf"

          [System.IO.File]::WriteAllText(
              $configPath,
              $env:EGRET_CONFIG,
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Egret configuration created."

      # ==============================
      # CONNECT EGRET
      # ==============================
      - name: Connect Egret
        shell: powershell
        run: |
          $wireguard = "$env:ProgramFiles\WireGuard\wireguard.exe"
          $config = "$env:TEMP\egret.conf"

          if (-not (Test-Path $wireguard)) {
              Write-Host "WireGuard executable not found."
              exit 1
          }

          if (-not (Test-Path $config)) {
              Write-Host "Egret config not found."
              exit 1
          }

          & $wireguard /installtunnelservice $config

          Start-Sleep -Seconds 10

          Get-Service |
            Where-Object {
              $_.Name -like "WireGuardTunnel*"
            } |
            Select-Object Name, Status |
            Format-Table -AutoSize

          Write-Host "Egret connection initialized."

      # ==============================
      # RDP PORT FORWARD
      # ==============================
      - name: Configure RDP Port
        shell: powershell
        run: |
          $port = [int]"${{ github.event.inputs.rdp_port }}"

          Write-Host "Configuring RDP port: $port"

          # Không cho port 3389 bị tạo portproxy
          if ($port -eq 3389) {

              Write-Host "Using native RDP port 3389."

              netsh advfirewall firewall add rule `
                name="RDP-EGE-3389" `
                dir=in `
                action=allow `
                protocol=TCP `
                localport=3389 `
                profile=any

          }
          else {

              # Xóa rule cũ nếu có
              netsh interface portproxy delete `
                v4tov4 `
                listenaddress=0.0.0.0 `
                listenport=$port `
                2>$null

              # Random/custom port -> RDP 3389
              netsh interface portproxy add `
                v4tov4 `
                listenaddress=0.0.0.0 `
                listenport=$port `
                connectaddress=127.0.0.1 `
                connectport=3389

              # Chỉ mở đúng port người dùng nhập
              netsh advfirewall firewall add rule `
                name="RDP-EGE-$port" `
                dir=in `
                action=allow `
                protocol=TCP `
                localport=$port `
                profile=any

              Write-Host ""
              Write-Host "========================================"
              Write-Host "RDP PORT FORWARD READY"
              Write-Host "========================================"
              Write-Host "External : $port"
              Write-Host "Internal : 3389"
              Write-Host "========================================"
          }

      # ==============================
      # CHECK RDP
      # ==============================
      - name: Check RDP
        shell: powershell
        run: |
          $port = [int]"${{ github.event.inputs.rdp_port }}"

          $service = Get-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          if ($service.Status -ne "Running") {
              Start-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue
          }

          # RDP gốc
          $rdp = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $rdp) {
              Write-Host "RDP 3389 is NOT listening."
              exit 1
          }

          Write-Host "RDP 3389: LISTENING"

          # Port custom
          if ($port -ne 3389) {

              $proxy = Get-NetTCPConnection `
                -LocalPort $port `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($proxy) {
                  Write-Host "Custom port $port: LISTENING"
              }
              else {
                  Write-Host "Custom port $port: NOT LISTENING"
                  exit 1
              }
          }

      # ==============================
      # SHOW ROUTES
      # ==============================
      - name: Verify Egret Route
        shell: powershell
        run: |
          Write-Host "Egret interface:"
          Get-NetIPAddress -AddressFamily IPv4 |
            Where-Object {
              $_.IPAddress -like "10.77.*"
            } |
            Format-Table IPAddress, InterfaceAlias

          Write-Host ""
          Write-Host "Route:"
          route print 10.77.0.0

      # ==============================
      # READY
      # ==============================
      - name: RDP Ready
        shell: powershell
        run: |
          $port = "${{ github.event.inputs.rdp_port }}"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "           RDP SERVER READY"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Username : admin"
          Write-Host "Port     : $port/TCP"
          Write-Host "Internal : 3389/TCP"
          Write-Host "Network  : Egret WireGuard"
          Write-Host "Public IP: HIDDEN"
          Write-Host ""
          Write-Host "Connection:"
          Write-Host "EGRET_PUBLIC_IP:$port"
          Write-Host ""

      # ==============================
      # KEEP ALIVE
      # ==============================
      - name: Keep RDP Alive
        shell: powershell
        run: |
          $duration = "${{ github.event.inputs.duration }}"

          switch ($duration) {

              "1h" {
                  $minutes = 60
              }

              "3h" {
                  $minutes = 180
              }

              "5h40m" {
                  $minutes = 340
              }

              default {
                  $minutes = 340
              }
          }

          Write-Host "RDP session duration: $minutes minutes."

          $endTime = (Get-Date).AddMinutes($minutes)

          while ((Get-Date) -lt $endTime) {

              $service = Get-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue

              if ($service.Status -ne "Running") {

                  Write-Host "TermService stopped. Restarting..."

                  Start-Service `
                    -Name "TermService" `
                    -ErrorAction SilentlyContinue
              }

              $remaining = $endTime - (Get-Date)

              $hours = [math]::Floor($remaining.TotalHours)
              $minutesLeft = $remaining.Minutes
              $secondsLeft = $remaining.Seconds

              Write-Host `
                "RDP active - remaining: ${hours}h ${minutesLeft}m ${secondsLeft}s"

              Start-Sleep -Seconds 30
          }

          Write-Host "RDP session time expired."

      # ==============================
      # CLEANUP
      # ==============================
      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $port = "${{ github.event.inputs.rdp_port }}"

          Write-Host "Cleaning up..."

          # Xóa portproxy nếu là custom port
          if ($port -ne "3389") {

              netsh interface portproxy delete `
                v4tov4 `
                listenaddress=0.0.0.0 `
                listenport=$port `
                2>$null

              netsh advfirewall firewall delete `
                rule `
                name="RDP-EGE-$port" `
                2>$null
          }
          else {

              netsh advfirewall firewall delete `
                rule `
                name="RDP-EGE-3389" `
                2>$null
          }

          # Xóa config
          $config = "$env:TEMP\egret.conf"

          if (Test-Path $config) {
              Remove-Item `
                $config `
                -Force `
                -ErrorAction SilentlyContinue
          }

          # Ngắt WireGuard
          $wireguard = "$env:ProgramFiles\WireGuard\wireguard.exe"

          if (Test-Path $wireguard) {

              Get-Service |
                Where-Object {
                  $_.Name -like "WireGuardTunnel*"
                } |
                ForEach-Object {

                  Stop-Service `
                    -Name $_.Name `
                    -Force `
                    -ErrorAction SilentlyContinue
                }
          }

          Disable-LocalUser `
            -Name "admin" `
            -ErrorAction SilentlyContinue

          Write-Host "Cleanup complete."st "Cleanup complete."
