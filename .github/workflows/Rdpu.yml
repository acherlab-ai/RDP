name: RDP PREMIUM EGE

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Session duration"
        required: false
        default: "5h40m"
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h40m"

jobs:
  RDP:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # ========================================
      # START
      # ========================================
      - name: Start RDP
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "        RDP PREMIUM EGE"
          Write-Host "========================================"
          Write-Host "Duration: ${{ github.event.inputs.duration }}"
          Write-Host "Network: Egret WireGuard"
          Write-Host ""

      # ========================================
      # ENABLE RDP
      # ========================================
      - name: Enable RDP
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Write-Host "RDP enabled."

      # ========================================
      # FIREWALL
      # ========================================
      - name: Open RDP Port
        shell: powershell
        run: |
          Write-Host "Opening TCP 3389..."

          netsh advfirewall firewall add rule `
            name="RDP-EGE-3389" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            profile=any

          Write-Host "TCP 3389 opened."

      # ========================================
      # CREATE RDP USER
      # ========================================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $username = "admin"
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
              Write-Host "RDP_PASSWORD secret is missing."
              exit 1
          }

          Write-Host "Creating RDP user..."

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $oldUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($oldUser) {
              Remove-LocalUser `
                -Name $username `
                -ErrorAction SilentlyContinue
          }

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "RDP Premium"

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Enable-LocalUser `
            -Name $username

          Write-Host "User created: admin"

      # ========================================
      # INSTALL WIREGUARD
      # ========================================
      - name: Install WireGuard
        shell: powershell
        run: |
          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"

          if (Test-Path $wg) {
              Write-Host "WireGuard already installed."
              exit 0
          }

          Write-Host "Installing WireGuard..."

          winget install `
            --id WireGuard.WireGuard `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Start-Sleep -Seconds 5

          if (-not (Test-Path $wg)) {
              Write-Host "WireGuard installation failed."
              exit 1
          }

          Write-Host "WireGuard installed."

      # ========================================
      # CREATE EGRET CONFIG
      # ========================================
      - name: Create Egret Config
        shell: powershell
        env:
          EGRET_CONFIG: ${{ secrets.EGRET_WG_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EGRET_CONFIG)) {
              Write-Host "EGRET_WG_CONFIG is missing."
              exit 1
          }

          $path = "$env:TEMP\egret.conf"

          [System.IO.File]::WriteAllText(
              $path,
              $env:EGRET_CONFIG,
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Config created."

      # ========================================
      # CONNECT EGRET (IMPROVED)
      # ========================================
      - name: Connect Egret
        shell: powershell
        run: |
          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"
          $config = "$env:TEMP\egret.conf"
          $name = "egret"
          $serviceName = "WireGuardTunnel`$egret"

          Write-Host "Installing Egret tunnel..."

          # Remove old tunnel if exists
          $old = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($old) {
              Write-Host "Removing old tunnel..."
              & $wg /uninstalltunnelservice $name 2>&1 | Out-Null
              Start-Sleep -Seconds 3
          }

          # Install tunnel service
          $p = Start-Process -FilePath $wg -ArgumentList "/installtunnelservice `"$config`"" -PassThru -WindowStyle Hidden
          Write-Host "Installer PID: $($p.Id)"

          if (-not $p.WaitForExit(30000)) {
              Write-Host "Installer timed out."
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              exit 1
          }

          Write-Host "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
              Write-Host "Installation failed."
              exit 1
          }

          # Wait for service to be created
          Write-Host "Waiting for service to be created..."
          $svc = $null
          for ($i = 1; $i -le 15; $i++) {
              $svc = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
              if ($svc) { break }
              Write-Host "Attempt $i/15 - Service not found yet."
              Start-Sleep -Seconds 2
          }

          if (-not $svc) {
              Write-Host "Service was not created after installation."
              Get-Service | Where-Object { $_.Name -like "WireGuard*" } | Format-Table -AutoSize
              exit 1
          }

          Write-Host "Service found. Current status: $($svc.Status)"

          # If service is not running, try to start it
          if ($svc.Status -ne "Running") {
              Write-Host "Service is not running. Attempting to start..."
              try {
                  Start-Service -Name $serviceName -ErrorAction Stop
                  Write-Host "Start-Service command completed."
              }
              catch {
                  Write-Host "Start-Service failed: $($_.Exception.Message)"
              }
          }

          # Wait for service to become Running
          Write-Host "Waiting for service to become Running..."
          $running = $false
          $maxAttempts = 60
          $sleepSeconds = 5

          for ($i = 1; $i -le $maxAttempts; $i++) {
              $svc = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
              if (-not $svc) {
                  Write-Host "Attempt $i/$maxAttempts - Service disappeared."
                  break
              }

              Write-Host "Attempt $i/$maxAttempts - Status: $($svc.Status)"

              if ($svc.Status -eq "Running") {
                  $running = $true
                  break
              }

              # If stuck in StartPending too long (after 10 attempts), try restart
              if ($i -eq 10 -and $svc.Status -eq "StartPending") {
                  Write-Host "Service has been in StartPending for too long. Attempting restart..."
                  Stop-Service -Name $serviceName -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 3
                  Start-Service -Name $serviceName -ErrorAction SilentlyContinue
              }

              Start-Sleep -Seconds $sleepSeconds
          }

          if (-not $running) {
              Write-Host ""
              Write-Host "========================================"
              Write-Host "       WIREGUARD START FAILED"
              Write-Host "========================================"
              Write-Host "Service details:"
              if ($svc) { $svc | Format-List * }
              Write-Host "All WireGuard services:"
              Get-Service | Where-Object { $_.Name -like "WireGuard*" } | Select-Object Name, Status, StartType | Format-Table -AutoSize
              Write-Host "WireGuard adapters:"
              Get-NetAdapter | Where-Object { $_.InterfaceDescription -like "*WireGuard*" } | Select-Object Name, InterfaceDescription, Status, LinkSpeed | Format-Table -AutoSize
              Write-Host "IPv4 addresses:"
              Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue | Select-Object IPAddress, PrefixLength, InterfaceAlias | Format-Table -AutoSize
              Write-Host "WireGuard diagnostic log:"
              & $wg /dumplog 2>&1
              exit 1
          }

          Write-Host "WireGuard service is Running."

      # ========================================
      # VERIFY EGRET ADDRESS
      # ========================================
      - name: Verify Egret Address
        shell: powershell
        run: |
          Write-Host "Checking 100.64.252.194..."

          $ip = Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
                Where-Object { $_.IPAddress -eq "100.64.252.194" }

          if ($ip) {
              Write-Host "Egret address detected."
              $ip | Select-Object IPAddress, PrefixLength, InterfaceAlias | Format-Table -AutoSize
          }
          else {
              Write-Host "Egret address NOT detected."
              Get-NetIPAddress -AddressFamily IPv4 -ErrorAction SilentlyContinue |
                  Select-Object IPAddress, PrefixLength, InterfaceAlias | Format-Table -AutoSize
              exit 1
          }

      # ========================================
      # TEST DNS
      # ========================================
      - name: Test DNS
        shell: powershell
        run: |
          Write-Host "Testing DNS..."

          try {
              Resolve-DnsName `
                -Name example.com `
                -Server 1.1.1.1 `
                -ErrorAction Stop |
                Where-Object {
                  $_.Type -eq "A"
                } |
                Select-Object Name, IPAddress |
                Format-Table -AutoSize

              Write-Host "DNS test completed."
          }
          catch {
              Write-Host "DNS test failed:"
              Write-Host $_.Exception.Message
          }

      # ========================================
      # CHECK RDP
      # ========================================
      - name: Check RDP
        shell: powershell
        run: |
          Write-Host "Checking RDP..."

          $user = Get-LocalUser `
            -Name "admin" `
            -ErrorAction SilentlyContinue

          if (-not $user) {
              Write-Host "RDP user does not exist."
              exit 1
          }

          $service = Get-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          if (-not $service) {
              Write-Host "TermService not found."
              exit 1
          }

          if ($service.Status -ne "Running") {
              Start-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 3
          }

          $listen = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($listen) {
              Write-Host "TCP 3389 is listening."
          }
          else {
              Write-Host "TCP 3389 is NOT listening."
              exit 1
          }

      # ========================================
      # READY
      # ========================================
      - name: RDP Ready
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "           RDP SERVER READY"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Username : admin"
          Write-Host "Port     : 3389/TCP"
          Write-Host "WG IP    : 100.64.252.194"
          Write-Host "Network  : Egret WireGuard"
          Write-Host "Public IP: HIDDEN"
          Write-Host ""
          Write-Host "RDP service is ready."
          Write-Host ""

      # ========================================
      # KEEP ALIVE
      # ========================================
      - name: Keep RDP Alive
        shell: powershell
        run: |
          $duration = "${{ github.event.inputs.duration }}"

          switch ($duration) {
              "1h"    { $sessionMinutes = 60 }
              "3h"    { $sessionMinutes = 180 }
              "5h40m" { $sessionMinutes = 340 }
              default { $sessionMinutes = 340 }
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "          RDP SESSION STARTED"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "Session duration: $sessionMinutes minutes."

          $endTime = (Get-Date).AddMinutes($sessionMinutes)

          while ((Get-Date) -lt $endTime) {

              # Check RDP service
              $service = Get-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue

              if ($service -and $service.Status -ne "Running") {
                  Write-Host "TermService stopped. Restarting..."
                  Start-Service `
                    -Name "TermService" `
                    -ErrorAction SilentlyContinue
              }

              # Check RDP port
              $listen = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if (-not $listen) {
                  Write-Host "RDP 3389 not listening. Restarting..."
                  Restart-Service `
                    -Name "TermService" `
                    -Force `
                    -ErrorAction SilentlyContinue
              }

              # Check WireGuard
              $wgService = Get-Service `
                -Name "WireGuardTunnel`$egret" `
                -ErrorAction SilentlyContinue

              if ($wgService -and $wgService.Status -ne "Running") {
                  Write-Host "Egret WireGuard stopped. Restarting..."
                  Start-Service `
                    -Name "WireGuardTunnel`$egret" `
                    -ErrorAction SilentlyContinue
              }

              # Check Egret IP
              $egretIP = Get-NetIPAddress `
                -AddressFamily IPv4 `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.IPAddress -eq "100.64.252.194"
                }

              if (-not $egretIP) {
                  Write-Host "WARNING: Egret IP not detected."
              }

              # Show remaining time
              $remaining = $endTime - (Get-Date)
              $hours = [math]::Floor($remaining.TotalHours)
              $minutesLeft = $remaining.Minutes
              $secondsLeft = $remaining.Seconds

              Write-Host `
                "RDP active - remaining: ${hours}h ${minutesLeft}m ${secondsLeft}s"

              Start-Sleep -Seconds 30
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       RDP SESSION TIME EXPIRED"
          Write-Host "========================================"

      # ========================================
      # CLEANUP
      # ========================================
      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "Cleaning up..."

          # Remove WireGuard tunnel
          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"

          if (Test-Path $wg) {
              & $wg `
                /uninstalltunnelservice `
                "egret" `
                2>&1
          }

          # Remove config
          Remove-Item `
            "$env:TEMP\egret.conf" `
            -Force `
            -ErrorAction SilentlyContinue

          # Remove firewall rule
          netsh advfirewall firewall delete rule `
            name="RDP-EGE-3389" `
            2>$null

          # Disable RDP user
          Disable-LocalUser `
            -Name "admin" `
            -ErrorAction SilentlyContinue

          Write-Host "Cleanup complete."
