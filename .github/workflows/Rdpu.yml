name: RDP PREMIUM EGE

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Session duration"
        required: false
        default: "5h40m"
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h40m"

      rdp_port:
        description: "RDP Public Port (1024-65535)"
        required: true
        default: "3389"
        type: string

jobs:
  RDP:
    runs-on: windows-latest
    timeout-minutes: 340

    steps:

      # ==========================================
      # START
      # ==========================================
      - name: Start RDP
        shell: powershell
        run: |
          $port = "${{ github.event.inputs.rdp_port }}"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "        RDP PREMIUM EGE"
          Write-Host "========================================"
          Write-Host "Duration : ${{ github.event.inputs.duration }}"
          Write-Host "RDP Port : $port"
          Write-Host "Internal : 3389"
          Write-Host "Network  : Egret WireGuard"
          Write-Host "========================================"
          Write-Host ""

      # ==========================================
      # VALIDATE PORT
      # ==========================================
      - name: Validate RDP Port
        shell: powershell
        run: |
          $portText = "${{ github.event.inputs.rdp_port }}"

          if ($portText -notmatch '^\d+$') {
              Write-Host "ERROR: Port must contain numbers only."
              exit 1
          }

          $port = [int]$portText

          if ($port -lt 1024 -or $port -gt 65535) {
              Write-Host "ERROR: Port must be between 1024 and 65535."
              exit 1
          }

          Write-Host "Requested port: $port"
          Write-Host "Port validation: OK"

      # ==========================================
      # ENABLE RDP
      # ==========================================
      - name: Enable RDP
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3

          Write-Host "RDP enabled."

      # ==========================================
      # CREATE RDP USER
      # ==========================================
      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $username = "admin"
          $password = $env:RDP_PASSWORD

          if ([string]::IsNullOrWhiteSpace($password)) {
              Write-Host "ERROR: RDP_PASSWORD secret is missing."
              exit 1
          }

          Write-Host "Creating RDP user..."

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $oldUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($oldUser) {
              Write-Host "Removing existing user..."

              Remove-LocalUser `
                -Name $username `
                -ErrorAction SilentlyContinue
          }

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -Description "RDP Premium"

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Enable-LocalUser `
            -Name $username

          Write-Host "RDP user created: $username"

      # ==========================================
      # INSTALL WIREGUARD
      # ==========================================
      - name: Install WireGuard
        shell: powershell
        run: |
          Write-Host "Installing WireGuard..."

          winget install `
            --id WireGuard.WireGuard `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host "WireGuard installation complete."

      # ==========================================
      # CREATE EGRET CONFIG
      # ==========================================
      - name: Create Egret Config
        shell: powershell
        env:
          EGRET_CONFIG: ${{ secrets.EGRET_WG_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EGRET_CONFIG)) {
              Write-Host "ERROR: EGRET_WG_CONFIG secret is missing."
              exit 1
          }

          $configPath = "$env:TEMP\egret.conf"

          [System.IO.File]::WriteAllText(
              $configPath,
              $env:EGRET_CONFIG,
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "Egret configuration created."

      # ==========================================
      # CONNECT EGRET
      # ==========================================
      - name: Connect Egret
        shell: powershell
        run: |
          Write-Host "Connecting to Egret WireGuard..."

          $wireguard = "$env:ProgramFiles\WireGuard\wireguard.exe"
          $config = "$env:TEMP\egret.conf"

          if (-not (Test-Path $wireguard)) {
              Write-Host "ERROR: WireGuard executable not found."
              exit 1
          }

          if (-not (Test-Path $config)) {
              Write-Host "ERROR: Egret config not found."
              exit 1
          }

          & $wireguard /installtunnelservice $config

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "WireGuard services:"

          Get-Service |
            Where-Object {
              $_.Name -like "WireGuardTunnel*"
            } |
            Select-Object Name, Status |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Egret connection initialized."

      # ==========================================
      # VERIFY EGRET IP
      # ==========================================
      - name: Verify Egret
        shell: powershell
        run: |
          Write-Host "Checking Egret WireGuard interface..."

          $ip = Get-NetIPAddress `
            -AddressFamily IPv4 `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.IPAddress -eq "10.77.1.7"
            }

          if (-not $ip) {
              Write-Host "ERROR: 10.77.1.7 was not found."
              exit 1
          }

          Write-Host "Egret IP 10.77.1.7: OK"

          Write-Host ""
          Write-Host "Egret interface:"
          Get-NetIPAddress `
            -AddressFamily IPv4 |
            Where-Object {
              $_.IPAddress -like "10.77.*"
            } |
            Format-Table IPAddress, InterfaceAlias

          Write-Host ""
          Write-Host "Egret route:"
          route print 10.77.0.0

      # ==========================================
      # TEST LOCAL RDP
      # ==========================================
      - name: Test Local RDP
        shell: powershell
        run: |
          Write-Host "Testing local Windows RDP..."

          $service = Get-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          if (-not $service) {
              Write-Host "ERROR: TermService not found."
              exit 1
          }

          if ($service.Status -ne "Running") {
              Write-Host "TermService is stopped. Starting..."

              Start-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 3
          }

          $rdp = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if ($rdp.TcpTestSucceeded) {
              Write-Host "Local RDP 127.0.0.1:3389: OK"
          }
          else {
              Write-Host "ERROR: Local RDP 3389 is not reachable."
              exit 1
          }

          Write-Host ""
          Write-Host "RDP listener:"
          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue |
            Format-Table LocalAddress, LocalPort, State

      # ==========================================
      # TEST EGRET GATEWAY
      # ==========================================
      - name: Test Egret Network
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "       TEST EGRET NETWORK"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Testing Egret gateway 10.77.0.1..."

          $gateway = Test-NetConnection `
            -ComputerName "10.77.0.1" `
            -WarningAction SilentlyContinue

          Write-Host "Ping to 10.77.0.1: $($gateway.PingSucceeded)"

          Write-Host ""
          Write-Host "Testing TCP 10.77.0.1:1194..."

          $wgTest = Test-NetConnection `
            -ComputerName "10.77.0.1" `
            -Port 1194 `
            -WarningAction SilentlyContinue

          Write-Host "TCP 1194: $($wgTest.TcpTestSucceeded)"

          Write-Host ""
          Write-Host "Testing RDP through WireGuard address..."

          $rdpPrivate = Test-NetConnection `
            -ComputerName "10.77.1.7" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host "10.77.1.7:3389 TCP: $($rdpPrivate.TcpTestSucceeded)"

          Write-Host ""
          Write-Host "========================================"

      # ==========================================
      # CONFIGURE CUSTOM RDP PORT
      # ==========================================
      - name: Configure RDP Port
        shell: powershell
        run: |
          $port = [int]"${{ github.event.inputs.rdp_port }}"

          Write-Host ""
          Write-Host "Configuring RDP port: $port"

          # Remove existing proxy for this port
          netsh interface portproxy delete `
            v4tov4 `
            listenaddress=0.0.0.0 `
            listenport=$port `
            2>$null

          # Remove old firewall rule
          netsh advfirewall firewall delete `
            rule `
            name="RDP-EGE-$port" `
            2>$null

          if ($port -eq 3389) {

              Write-Host "Using native RDP 3389."

          }
          else {

              Write-Host "Creating:"
              Write-Host "${port} -> 127.0.0.1:3389"

              netsh interface portproxy add `
                v4tov4 `
                listenaddress=0.0.0.0 `
                listenport=$port `
                connectaddress=127.0.0.1 `
                connectport=3389

          }

          # Open selected TCP port
          netsh advfirewall firewall add rule `
            name="RDP-EGE-$port" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=$port `
            profile=any

          Write-Host "Firewall opened for TCP ${port}."

      # ==========================================
      # CHECK SELECTED RDP PORT
      # ==========================================
      - name: Check RDP
        shell: powershell
        run: |
          $port = [int]"${{ github.event.inputs.rdp_port }}"

          Write-Host "Checking TermService..."

          $service = Get-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          if (-not $service) {
              Write-Host "ERROR: TermService not found."
              exit 1
          }

          if ($service.Status -ne "Running") {

              Write-Host "Starting TermService..."

              Start-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 3
          }

          # Native RDP
          $rdp = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $rdp) {
              Write-Host "ERROR: RDP 3389 is NOT listening."
              exit 1
          }

          Write-Host "RDP 3389: LISTENING"

          # Custom port
          if ($port -ne 3389) {

              $proxy = Get-NetTCPConnection `
                -LocalPort $port `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($proxy) {

                  Write-Host "Custom port ${port}: LISTENING"

              }
              else {

                  Write-Host "ERROR: Custom port ${port}: NOT LISTENING"

                  Write-Host ""
                  Write-Host "PortProxy table:"
                  netsh interface portproxy show all

                  exit 1
              }

          }
          else {

              Write-Host "Using native RDP port 3389."

          }

      # ==========================================
      # SHOW PORT CONFIG
      # ==========================================
      - name: Show RDP Port
        shell: powershell
        run: |
          $port = [int]"${{ github.event.inputs.rdp_port }}"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       RDP PORT CONFIGURATION"
          Write-Host "========================================"

          Write-Host "Selected port: $port"

          if ($port -eq 3389) {

              Write-Host "Mode: Native RDP"
              Write-Host "Destination: 3389"

          }
          else {

              Write-Host "Mode: PortProxy"
              Write-Host "External: ${port}"
              Write-Host "Internal: 3389"
              Write-Host "Forward: ${port} -> 127.0.0.1:3389"

          }

          Write-Host ""
          Write-Host "PortProxy table:"

          netsh interface portproxy show all

          Write-Host ""
          Write-Host "Firewall rule:"

          Get-NetFirewallRule `
            -DisplayName "RDP-EGE-$port" `
            -ErrorAction SilentlyContinue |
            Select-Object DisplayName, Enabled, Direction, Action

          Write-Host ""
          Write-Host "========================================"

      # ==========================================
      # READY
      # ==========================================
      - name: RDP Ready
        shell: powershell
        run: |
          $port = "${{ github.event.inputs.rdp_port }}"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "           RDP SERVER READY"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Username : admin"
          Write-Host "Port     : $port/TCP"
          Write-Host "Internal : 3389/TCP"
          Write-Host "Network  : Egret WireGuard"
          Write-Host "Public IP: HIDDEN"
          Write-Host ""

          Write-Host "Connect:"
          Write-Host "EGRET_PUBLIC_IP:$port"

          Write-Host ""

          if ($port -ne "3389") {
              Write-Host "Forward:"
              Write-Host "$port -> 127.0.0.1:3389"
          }

          Write-Host ""
          Write-Host "========================================"

      # ==========================================
      # KEEP ALIVE
      # ==========================================
      - name: Keep RDP Alive
        shell: powershell
        run: |
          $duration = "${{ github.event.inputs.duration }}"

          switch ($duration) {

              "1h" {
                  $minutes = 60
              }

              "3h" {
                  $minutes = 180
              }

              "5h40m" {
                  $minutes = 340
              }

              default {
                  $minutes = 340
              }
          }

          Write-Host ""
          Write-Host "RDP session duration: $minutes minutes."

          $endTime = (Get-Date).AddMinutes($minutes)

          while ((Get-Date) -lt $endTime) {

              $service = Get-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue

              if ($service.Status -ne "Running") {

                  Write-Host "TermService stopped. Restarting..."

                  Start-Service `
                    -Name "TermService" `
                    -ErrorAction SilentlyContinue
              }

              $remaining = $endTime - (Get-Date)

              $hours = [math]::Floor($remaining.TotalHours)
              $minutesLeft = $remaining.Minutes
              $secondsLeft = $remaining.Seconds

              Write-Host `
                "RDP active - remaining: ${hours}h ${minutesLeft}m ${secondsLeft}s"

              Start-Sleep -Seconds 30
          }

          Write-Host "RDP session time expired."

      # ==========================================
      # CLEANUP
      # ==========================================
      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $port = [int]"${{ github.event.inputs.rdp_port }}"

          Write-Host "Cleaning up..."

          # Remove custom port proxy
          if ($port -ne 3389) {

              netsh interface portproxy delete `
                v4tov4 `
                listenaddress=0.0.0.0 `
                listenport=$port `
                2>$null
          }

          # Remove firewall rule
          netsh advfirewall firewall delete `
            rule `
            name="RDP-EGE-$port" `
            2>$null

          # Remove WireGuard config
          $config = "$env:TEMP\egret.conf"

          if (Test-Path $config) {

              Remove-Item `
                $config `
                -Force `
                -ErrorAction SilentlyContinue
          }

          # Stop WireGuard
          $wireguard = "$env:ProgramFiles\WireGuard\wireguard.exe"

          if (Test-Path $wireguard) {

              Get-Service |
                Where-Object {
                  $_.Name -like "WireGuardTunnel*"
                } |
                ForEach-Object {

                  Stop-Service `
                    -Name $_.Name `
                    -Force `
                    -ErrorAction SilentlyContinue
                }
          }

          # Disable RDP user
          Disable-LocalUser `
            -Name "admin" `
            -ErrorAction SilentlyContinue

          Write-Host "Cleanup complete."
