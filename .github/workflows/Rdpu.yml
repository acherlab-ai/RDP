name: RDP + Full WireGuard Network

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "RDP session duration"
        required: true
        default: "5h40m"
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h40m"

      rdp_port:
        description: "RDP public port"
        required: true
        default: "3389"
        type: string

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 340

    steps:

      # =========================================
      # PORT
      # =========================================
      - name: Validate port
        shell: powershell
        run: |
          $portText = "${{ github.event.inputs.rdp_port }}"

          if ($portText -notmatch '^\d+$') {
              Write-Host "Invalid port."
              exit 1
          }

          $port = [int]$portText

          if ($port -lt 1024 -or $port -gt 65535) {
              Write-Host "Port must be 1024-65535."
              exit 1
          }

          Write-Host "RDP port: $port"

      # =========================================
      # RDP
      # =========================================
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Start-Sleep 3

          Write-Host "RDP enabled."

      # =========================================
      # USER
      # =========================================
      - name: Create RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              Write-Host "RDP_PASSWORD secret is missing."
              exit 1
          }

          $username = "admin"

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
              Remove-LocalUser `
                -Name $username `
                -ErrorAction SilentlyContinue
          }

          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name $username `
            -Password $password `
            -AccountNeverExpires `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "User created."

      # =========================================
      # WIREGUARD
      # =========================================
      - name: Install WireGuard
        shell: powershell
        run: |
          winget install `
            --id WireGuard.WireGuard `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host "WireGuard installed."

      # =========================================
      # CONFIG
      # =========================================
      - name: Create WireGuard config
        shell: powershell
        env:
          WG_CONFIG: ${{ secrets.EGRET_WG_CONFIG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WG_CONFIG)) {
              Write-Host "EGRET_WG_CONFIG secret is missing."
              exit 1
          }

          $config = "$env:TEMP\egret.conf"

          [System.IO.File]::WriteAllText(
              $config,
              $env:WG_CONFIG,
              [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "WireGuard config created."

      # =========================================
      # CONNECT
      # =========================================
      - name: Connect WireGuard
        shell: powershell
        run: |
          $wg = "$env:ProgramFiles\WireGuard\wireguard.exe"
          $config = "$env:TEMP\egret.conf"

          if (-not (Test-Path $wg)) {
              Write-Host "WireGuard executable not found."
              exit 1
          }

          & $wg /installtunnelservice $config

          Start-Sleep 10

          Get-Service |
            Where-Object {
              $_.Name -like "WireGuardTunnel*"
            } |
            Select-Object Name, Status |
            Format-Table -AutoSize

      # =========================================
      # VERIFY WG IP
      # =========================================
      - name: Verify WireGuard
        shell: powershell
        run: |
          Write-Host "Checking WireGuard..."

          $ip = Get-NetIPAddress `
            -AddressFamily IPv4 `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.IPAddress -eq "100.64.252.194"
            }

          if (-not $ip) {
              Write-Host "WireGuard IPv4 not found."
              exit 1
          }

          Write-Host "100.64.252.194: OK"

          Write-Host ""
          Write-Host "WireGuard interfaces:"

          Get-NetIPAddress `
            -AddressFamily IPv4 |
            Where-Object {
              $_.IPAddress -eq "100.64.252.194"
            } |
            Format-Table IPAddress, InterfaceAlias

      # =========================================
      # VERIFY IPV6
      # =========================================
      - name: Verify IPv6
        shell: powershell
        run: |
          Write-Host "Checking WireGuard IPv6..."

          $ipv6 = Get-NetIPAddress `
            -AddressFamily IPv6 `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.IPAddress -like "2a11:6c7:f34:34::*"
            }

          if ($ipv6) {
              Write-Host "WireGuard IPv6: OK"

              $ipv6 |
                Format-Table IPAddress, InterfaceAlias
          }
          else {
              Write-Host "WARNING: WireGuard IPv6 was not detected."
          }

      # =========================================
      # FULL-TUNNEL ROUTING
      # =========================================
      - name: Configure full tunnel
        shell: powershell
        run: |
          Write-Host "Checking default routes..."

          Write-Host ""
          Write-Host "IPv4 routes:"
          Get-NetRoute -AddressFamily IPv4 |
            Where-Object {
              $_.DestinationPrefix -eq "0.0.0.0/0"
            } |
            Format-Table DestinationPrefix, NextHop, InterfaceAlias, RouteMetric

          Write-Host ""
          Write-Host "IPv6 default routes:"
          Get-NetRoute -AddressFamily IPv6 |
            Where-Object {
              $_.DestinationPrefix -eq "::/0"
            } |
            Format-Table DestinationPrefix, NextHop, InterfaceAlias, RouteMetric

          Write-Host ""
          Write-Host "WireGuard full-tunnel configuration:"
          Write-Host "IPv4: 0.0.0.0/0"
          Write-Host "IPv6: ::/0"

      # =========================================
      # PUBLIC IP
      # =========================================
      - name: Check public IP
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "Checking public IPv4..."

          try {
              $ipv4 = Invoke-RestMethod `
                -Uri "https://api.ipify.org" `
                -TimeoutSec 15

              Write-Host "Public IPv4: $ipv4"
          }
          catch {
              Write-Host "Could not determine public IPv4."
          }

          Write-Host ""
          Write-Host "Checking public IPv6..."

          try {
              $ipv6 = Invoke-RestMethod `
                -Uri "https://api6.ipify.org" `
                -TimeoutSec 15

              Write-Host "Public IPv6: $ipv6"
          }
          catch {
              Write-Host "Could not determine public IPv6."
          }

      # =========================================
      # TEST INTERNET
      # =========================================
      - name: Test Internet through tunnel
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "Testing Internet..."

          $test = Test-NetConnection `
            -ComputerName "1.1.1.1" `
            -Port 443 `
            -WarningAction SilentlyContinue

          if ($test.TcpTestSucceeded) {
              Write-Host "Internet IPv4: OK"
          }
          else {
              Write-Host "Internet IPv4: FAILED"
          }

          Write-Host ""
          Write-Host "Route to 1.1.1.1:"

          Get-NetRoute `
            -DestinationPrefix "0.0.0.0/0" |
            Format-Table DestinationPrefix, NextHop, InterfaceAlias, RouteMetric

      # =========================================
      # LOCAL RDP
      # =========================================
      - name: Test RDP
        shell: powershell
        run: |
          $rdp = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $rdp.TcpTestSucceeded) {
              Write-Host "RDP 3389 failed."
              exit 1
          }

          Write-Host "RDP 3389: LISTENING"

          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue |
            Format-Table LocalAddress, LocalPort, State

      # =========================================
      # CUSTOM RDP PORT
      # =========================================
      - name: Configure custom RDP port
        shell: powershell
        run: |
          $port = [int]"${{ github.event.inputs.rdp_port }}"

          Write-Host "Selected RDP port: $port"

          netsh interface portproxy delete `
            v4tov4 `
            listenaddress=0.0.0.0 `
            listenport=$port `
            2>$null

          netsh advfirewall firewall delete `
            rule `
            name="RDP-WG-$port" `
            2>$null

          if ($port -eq 3389) {

              Write-Host "Native RDP port selected."

          }
          else {

              netsh interface portproxy add `
                v4tov4 `
                listenaddress=0.0.0.0 `
                listenport=$port `
                connectaddress=127.0.0.1 `
                connectport=3389

              Write-Host "${port} -> 127.0.0.1:3389"

          }

          netsh advfirewall firewall add rule `
            name="RDP-WG-$port" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=$port `
            profile=any

          Write-Host "Firewall rule added."

      # =========================================
      # VERIFY CUSTOM PORT
      # =========================================
      - name: Verify RDP port
        shell: powershell
        run: |
          $port = [int]"${{ github.event.inputs.rdp_port }}"

          if ($port -eq 3389) {
              Write-Host "RDP 3389 is active."
              exit 0
          }

          Write-Host "PortProxy configuration:"
          netsh interface portproxy show all

          $listener = Get-NetTCPConnection `
            -LocalPort $port `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($listener) {
              Write-Host "Custom port ${port}: LISTENING"
          }
          else {
              Write-Host "Custom port ${port}: NOT LISTENING"
              exit 1
          }

      # =========================================
      # READY
      # =========================================
      - name: RDP READY
        shell: powershell
        run: |
          $port = "${{ github.event.inputs.rdp_port }}"

          Write-Host ""
          Write-Host "========================================"
          Write-Host "           RDP SERVER READY"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Username : admin"
          Write-Host "RDP Port : $port"
          Write-Host "Internal : 3389"
          Write-Host "WG IPv4  : 100.64.252.194"
          Write-Host "WG IPv6  : 2a11:6c7:f34:34::2"
          Write-Host ""
          Write-Host "FULL-TUNNEL: ENABLED"
          Write-Host ""
          Write-Host "Connect:"
          Write-Host "PUBLIC_IP:$port"
          Write-Host ""
          Write-Host "========================================"

      # =========================================
      # KEEP ALIVE
      # =========================================
      - name: Keep Alive
        shell: powershell
        run: |
          switch ("${{ github.event.inputs.duration }}") {
              "1h" {
                  $minutes = 60
              }
              "3h" {
                  $minutes = 180
              }
              "5h40m" {
                  $minutes = 340
              }
              default {
                  $minutes = 340
              }
          }

          $end = (Get-Date).AddMinutes($minutes)

          while ((Get-Date) -lt $end) {

              $service = Get-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue

              if ($service -and $service.Status -ne "Running") {
                  Start-Service `
                    -Name "TermService" `
                    -ErrorAction SilentlyContinue
              }

              $left = $end - (Get-Date)

              Write-Host (
                "RDP active - remaining {0}h {1}m {2}s" -f `
                [math]::Floor($left.TotalHours),
                $left.Minutes,
                $left.Seconds
              )

              Start-Sleep -Seconds 30
          }

          Write-Host "Session finished."

      # =========================================
      # CLEANUP
      # =========================================
      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $port = [int]"${{ github.event.inputs.rdp_port }}"

          if ($port -ne 3389) {
              netsh interface portproxy delete `
                v4tov4 `
                listenaddress=0.0.0.0 `
                listenport=$port `
                2>$null
          }

          netsh advfirewall firewall delete `
            rule `
            name="RDP-WG-$port" `
            2>$null

          $config = "$env:TEMP\egret.conf"

          if (Test-Path $config) {
              Remove-Item `
                $config `
                -Force `
                -ErrorAction SilentlyContinue
          }

          Get-Service |
            Where-Object {
              $_.Name -like "WireGuardTunnel*"
            } |
            ForEach-Object {
              Stop-Service `
                -Name $_.Name `
                -Force `
                -ErrorAction SilentlyContinue
            }

          Disable-LocalUser `
            -Name "admin" `
            -ErrorAction SilentlyContinue

          Write-Host "Cleanup complete."
